<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}

</style></head><body>
<title>가스기능사 필기 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 홈(진도 요약 → 바로가기 → 회차 목록) / 풀이(고정 상단바 + 문제 카드[사진 있으면 2단, 없으면 1단] + Claude 질문 패널) / 결과. 배관 도색의 노란색을 단 하나의 강조색으로 */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunken:#eceeeb; --fg:#1d2321; --muted:#5d6763; --line:#d9ddda;
  --accent:#e0a800; --accent-ink:#3a2c00; --accent-soft:#fbf1cf;
  --ok:#1f5fbf; --ok-soft:#e2ebfa; --part:#9a7a00; --part-soft:#fdf2c2; --bad:#b3261e; --bad-soft:#f8e1df; --none:#cfd4d1;
  --formula:#f6f2e4; --photo:#0d0f0e; --scrim:rgba(10,12,11,.88); --link:#0b5cc0;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1d2220; --sunken:#181c1a; --fg:#e8ebe9; --muted:#9aa49f; --line:#323a37;
  --accent:#f2c230; --accent-ink:#2a2000; --accent-soft:#3a3214;
  --ok:#6ea8ff; --ok-soft:#172540; --part:#ffd54a; --part-soft:#3a3214; --bad:#f07d74; --bad-soft:#3b1d1b; --none:#3a423f;
  --formula:#25231a; --link:#7ab4ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1d2220; --sunken:#181c1a; --fg:#e8ebe9; --muted:#9aa49f; --line:#323a37;
  --accent:#f2c230; --accent-ink:#2a2000; --accent-soft:#3a3214;
  --ok:#6ea8ff; --ok-soft:#172540; --part:#ffd54a; --part-soft:#3a3214; --bad:#f07d74; --bad-soft:#3b1d1b; --none:#3a423f;
  --formula:#25231a; --link:#7ab4ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;padding:0 16px}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.4rem;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1rem;margin:0;font-weight:700}
.muted{color:var(--muted)} .small{font-size:.82rem} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.btn{font-weight:500;border-radius:6px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;padding-inline:8px}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--fg)}

/* 홈 */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--none);display:inline-block}
.sync.on i{background:var(--ok)}
.dday{display:flex;align-items:center;gap:8px;font-size:.85rem}
.dday b{font-family:var(--mono);font-size:1.25rem;color:var(--fg)}
.dday input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:.82rem}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;min-width:0}
.stat .k{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.stat .v{font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .v small{font-size:.85rem;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.qa b{font-size:.98rem}
.qa span{font-size:.8rem;color:var(--muted)}
.qa.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qa.main span{color:var(--accent-ink);opacity:.8}
.qa.main select{background:var(--surface);color:var(--fg);border-color:transparent}
.qa.main .row{opacity:1}
.qa:disabled{opacity:.5;cursor:default}
.qa .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.qa select{border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:2px 6px;font-size:.8rem}
.qa input[type=number]{width:4.2em;border:1px solid var(--line);border-radius:5px;background:var(--bg);padding:2px 6px;font-size:.85rem;font-family:var(--mono)}
.qa .row small{font-size:.8rem;color:var(--muted)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.hits{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.hit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.hit:first-child{border-top:0}
.hit .meta{font-size:.78rem;color:var(--muted);white-space:nowrap}
.hit .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:none;border-radius:7px;padding:8px 4px;cursor:pointer;min-width:0}
.tabs button span{font-size:.75rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs button[aria-selected="true"] b{color:var(--fg)}
.section{display:flex;flex-direction:column;gap:8px}
.section header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sets{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.set{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.set:first-child{border-top:0}
.set:hover{background:var(--sunken)}
.set .name b{display:block}
.set .name span{font-size:.78rem;color:var(--muted)}
.cells{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.cells i{width:12px;height:12px;border-radius:2px;background:var(--none)}
.cells i.v-정답{background:var(--ok)} .cells i.v-부분정답{background:#f2c200} .cells i.v-오답,.cells i.v-확인{background:var(--bad)} .cells i.gap{background:transparent;border:1px dashed var(--none)}
/* 이번 회독에서 아직 안 푼 칸: 지난 회독 결과는 흐리게만 */
.cells i.old{opacity:.22}
.rbadge{display:inline-block;font-size:.7rem;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.rbadge.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.set .pct{font-size:.82rem;color:var(--muted);text-align:right;white-space:nowrap}
.placeholder{padding:14px 16px;font-size:.85rem;color:var(--muted);background:var(--sunken);border:1px dashed var(--line);border-radius:10px}
details.check{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 16px}
details.check summary{cursor:pointer;font-weight:500}
.checks{display:flex;flex-direction:column;margin-top:8px}
.checks button{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr);gap:10px;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 0;cursor:pointer;font-size:.85rem}
.checks button:first-child{border-top:0}
.checks button span:first-child{color:var(--muted)}
.checks button:hover span:last-child{text-decoration:underline}

/* 풀이 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar .row1{display:flex;align-items:center;gap:10px;justify-content:space-between}
.bar .title{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#score{white-space:nowrap}
.map{display:flex;gap:5px;overflow-x:auto;padding:3px 3px 4px}
.map button{flex:0 0 auto;min-width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:.82rem;cursor:pointer}
.map .mapsec{flex:0 0 auto;align-self:center;font-size:.72rem;font-weight:700;color:var(--muted);padding:0 2px 0 6px}
.map .mapsec:first-child{padding-left:0}
.map button.cur{outline:2px solid var(--accent);outline-offset:1px}
.map button.v-done{background:var(--accent-soft);border-color:var(--accent)}
details.mockres{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.mockres > summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:.9rem;color:var(--muted)}
details.mockres[open] > summary{border-bottom:1px solid var(--line)}
.map button.prev{border-style:dashed;opacity:.75}
.map button.v-정답{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.map button.v-부분정답{background:var(--part-soft);border-color:var(--part);color:var(--part)}
.map button.v-오답,.map button.v-확인{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.stage{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;overflow:clip}
/* 문제(번호·문장·지문)는 답을 쓰며 내려가도 위에 고정. 너무 길면 그 안에서만 스크롤 */
.qtop{position:sticky;top:var(--barH,110px);z-index:3;background:var(--surface);display:flex;flex-direction:column;gap:10px;margin:-20px -20px 0;padding:20px 20px 12px;border-bottom:1px solid transparent;max-height:42vh;overflow:auto}
.qtop.stuck{border-bottom-color:var(--line);box-shadow:0 6px 10px -8px rgba(0,0,0,.18)}
.no-photo .body .qtop{margin:-22px -24px 0;padding:22px 24px 12px}
.card.has-photo .photo{position:sticky;top:var(--barH,110px);align-self:start}
.card.has-photo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card.no-photo{grid-template-columns:minmax(0,1fr)}
.stage.narrow{max-width:820px;width:100%;margin-inline:auto}
.solve{display:flex;flex-direction:column;gap:16px}
.solve-main{display:flex;flex-direction:column;gap:16px;min-width:0}
/* 데스크톱: 왼쪽 문제, 오른쪽 Claude 채팅(화면 높이 가득, 입력칸은 아래 고정, 대화만 스크롤) */
@media (min-width:1100px){
  .wrap:has(.solve){max-width:none;padding-block:0;gap:0}
  .solve{display:grid;grid-template-columns:minmax(0,1fr) clamp(400px,38vw,620px);gap:24px;align-items:start}
  .solve-main{padding-block:0 40px}
  .solve .stage.narrow{max-width:900px;margin-inline:auto}
  .solve .card.has-photo .photo img{max-height:64vh}
  .solve > .ask{position:sticky;top:0;height:100vh;border-radius:0;border-width:0 0 0 1px;margin-right:-16px;padding:18px 22px}
  .solve > .ask .msgs{flex:1;overflow:auto;padding-right:6px}
  .solve > .ask .note-wrap{min-height:0}
  .solve > .ask header{padding-bottom:10px;border-bottom:1px solid var(--line)}
  .solve > .ask .askf textarea{min-height:76px}
}
/* 필기 모드에서 사진이 있는 문제: 사진을 위로(높이 줄임, 눌러서 확대), 답안·필기 칸은 아래에 가로로 넓게 */
.solve .stage.inking .card.has-photo{grid-template-columns:minmax(0,1fr)}
.solve .stage.inking .card.has-photo .photo{position:relative;top:auto;min-height:0;max-height:36vh}
.solve .stage.inking .card.has-photo .photo img{max-height:36vh}
@media (min-width:1600px){ .solve{grid-template-columns:minmax(0,1fr) clamp(480px,36vw,680px)} }
.photo{background:var(--photo);display:flex;align-items:center;justify-content:center;min-height:240px;border:0;padding:0;cursor:zoom-in;position:relative}
.photo img{max-height:440px;width:100%;object-fit:contain;display:block}
.photo .zoom{position:absolute;right:8px;bottom:8px;font-size:.72rem;background:var(--scrim);color:#fff;padding:2px 8px;border-radius:4px}
.body{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.no-photo .body{padding:22px 24px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--mono);background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:4px;font-size:.85rem}
.qsrc{color:var(--muted);font-size:.8rem;flex:1;min-width:0}
.tag-check{font-size:.72rem;color:var(--part);border:1px solid var(--part);border-radius:999px;padding:0 8px;white-space:nowrap}
.star{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.starbox{display:inline-flex;gap:3px}
.star.minus{padding:3px 9px;font-weight:700}
.klink{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.star.known.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
#knownwrap{display:inline-flex}
.star.s2[aria-pressed="true"]{background:var(--part-soft);border-color:var(--part);color:var(--part)}
.star.s3[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}
.star[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.prompt{font-weight:700;font-size:1.05rem;margin:0;text-wrap:pretty}
.ctx{border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:.92rem;white-space:pre-line;margin:0}
.vnote{font-size:.82rem;color:var(--muted);margin:0}
.vnote::before{content:"영상 설명 · ";font-weight:500}
.flag{font-size:.8rem;background:var(--part-soft);color:var(--part);padding:6px 10px;border-radius:6px;margin:0}
.flag b{font-weight:700}
.note{font-size:.8rem;color:var(--muted);margin:0}
form{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.82rem;color:var(--muted);font-weight:500}
.field input,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%}
.field textarea{min-height:80px;resize:vertical}
.field.f-정답 input,.field.f-정답 textarea{border-color:var(--ok);background:var(--ok-soft)}
.field.f-부분정답 input,.field.f-부분정답 textarea{border-color:var(--part);background:var(--part-soft)}
.field.f-오답 input,.field.f-오답 textarea{border-color:var(--bad);background:var(--bad-soft)}
.field.f-정답 label::after{content:" ✓";color:var(--ok);font-weight:700}
.field.f-부분정답 label::after{content:" △";color:var(--part);font-weight:700}
.field.f-오답 label::after{content:" ✕";color:var(--bad);font-weight:700}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.group-label{font-size:.8rem;color:var(--muted);margin:2px 0 -4px}
.units{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:thin}
.units button{flex:0 0 auto;font-family:var(--mono);font-size:.9rem;min-width:40px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--fg)}
.units .hint{font-size:.75rem;color:var(--muted);align-self:center;margin-left:4px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.ink-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pen-sig{font-size:.7rem;color:var(--muted);flex:0 0 100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;height:1.4em}
.stage.inking{padding-left:88px}
@media (max-width:1099px){ body.inking .solve > .ask{margin-left:88px} }
.ink-float{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.ink-float button{width:64px;height:58px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1.35rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--fg);touch-action:manipulation}
.ink-float button small{font-size:.66rem;color:var(--muted)}
.ink-float button.toggle{height:84px;gap:2px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ink-float button.toggle small{color:var(--accent-ink);font-weight:700;font-size:.72rem}
.ink-float button.toggle em{font-style:normal;font-size:.58rem;opacity:.75}
.ink-float button.toggle.erase{background:var(--bad);border-color:var(--bad);color:#fff}
.ink-float button.toggle.erase small,.ink-float button.toggle.erase em{color:#fff}
.pad.erasing{cursor:cell}
body.inking .pad-wrap:has(.erasing){outline:2px dashed var(--bad);outline-offset:-2px}
.pad-wrap{border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;background-image:linear-gradient(transparent calc(100% - 1px), var(--line) 0);background-size:100% 42px}
.pad{display:block;width:100%;touch-action:none;color:var(--fg);cursor:crosshair}
.field.ink .ink-text{font-size:.85rem;padding:6px 10px;background:var(--surface);border-style:dashed}
.field.ink textarea.ink-text{min-height:44px}
.field.f-정답 .pad-wrap{border-color:var(--ok)} .field.f-부분정답 .pad-wrap{border-color:var(--part)} .field.f-오답 .pad-wrap{border-color:var(--bad)}
.units button.w{font-family:var(--font)}
.units button:active{background:var(--accent-soft)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font-size:.75rem;color:var(--muted)}
.result{border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.result.v-정답{background:var(--ok-soft)} .result.v-부분정답{background:var(--part-soft)} .result.v-오답{background:var(--bad-soft)} .result.v-확인,.result.v-wait{background:var(--accent-soft)}
.verdict{font-weight:700;font-size:1.05rem}
.v-정답 .verdict{color:var(--ok)} .v-부분정답 .verdict{color:var(--part)} .v-오답 .verdict{color:var(--bad)}
.how{font-size:.75rem;color:var(--muted);font-weight:400;margin-left:6px}
.prow{font-size:.88rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
.prow .tag{font-weight:700}
.model{font-size:.9rem;margin:0}
.model dt{font-weight:700;color:var(--muted);font-size:.78rem;margin-top:4px}
.model dd{margin:0 0 4px}
.pool{margin:2px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:2px}
.pool li.got::marker{color:var(--ok)}
.pool li.got{font-weight:500}
.pool .mine{font-size:.72rem;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:0 6px;margin-left:6px;font-weight:500}
.extra{font-size:.8rem;color:var(--muted);margin:2px 0 0}
.self{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:8px}

/* 관련 이론 · 풀이 */
details.theory{border-top:1px solid var(--line);padding-top:10px}
details.theory summary{cursor:pointer;color:var(--fg);font-weight:500;font-size:.9rem}
details.theory summary span{color:var(--muted);font-weight:400}
.theory-body{display:flex;flex-direction:column;gap:10px;margin-top:10px;font-size:.9rem;line-height:1.7}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:.84rem}
.tbl th{background:var(--sunken);font-weight:700;text-align:left;padding:7px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 10px;vertical-align:top;border-top:1px solid var(--line);min-width:5.5em}
.tbl tr:first-child td{border-top:0}
/* 관련 이론 표: 칸 여백 줄이고, 짧은 글(500L 이상 등)은 줄바꿈 안 함, 한글은 단어 단위로 줄바꿈 */
.ttbl table{font-size:.82rem}
.ttbl th,.ttbl td{padding:6px 8px;word-break:keep-all;min-width:0}
.ttbl td.nw,.ttbl th{white-space:nowrap}
.ttbl td[rowspan]{vertical-align:middle;background:var(--bg)}
.ttbl td{border-left:1px solid var(--line)} .ttbl td:first-child{border-left:0}
.rich{display:flex;flex-direction:column;gap:4px;min-width:0}
.rich p{margin:0}
.rich .gap{height:4px}
.rich ul{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:2px}
.rich ul.sub{padding-left:2.2em;list-style:"– "}
.rich .rn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:baseline}
.rich .rn .rm{font-weight:700;font-variant-numeric:tabular-nums}
.rich .rnote{color:var(--muted);font-size:.92em}
.rich .rwhere{color:var(--muted);font-size:.92em}
.rich .rlabel .chip{display:inline-block;font-size:.75em;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:4px;color:var(--muted)}
.rf{background:var(--formula);border-radius:6px;padding:7px 12px;font-variant-numeric:tabular-nums;overflow-x:auto;white-space:nowrap;line-height:2.1}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.25;font-size:.9em}
.frac .fn{padding:0 3px 1px}
.frac .fd{padding:1px 3px 0;border-top:1px solid currentColor}
.rad .radi{border-top:1px solid currentColor;padding:0 1px;margin-left:1px}

/* Claude에게 묻기 */
.ask{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
/* 오른쪽 칸 전환: Claude ↔ 노트(펜으로 끄적이는 연습지, 저장 안 함) */
.side-tabs{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:3px}
.side-tabs button{border:0;background:none;border-radius:6px;padding:4px 12px;font-size:.85rem;font-weight:500;cursor:pointer;color:var(--muted);white-space:nowrap}
.side-tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.note-wrap{flex:1;min-height:60vh;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;background-image:linear-gradient(transparent calc(100% - 1px), var(--line) 0);background-size:100% 42px;position:relative}
.note-wrap:has(.erasing){outline:2px dashed var(--bad);outline-offset:-2px}
.notepad{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none;color:var(--fg);cursor:crosshair}
.notepad.erasing{cursor:cell}
.ask header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ask header h2{flex:1;min-width:0}
.badge{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.msgs{display:flex;flex-direction:column;gap:10px}
.ask .msgs{min-height:0}
.msg{border-radius:10px;padding:10px 14px;font-size:.92rem;line-height:1.7;max-width:100%;min-width:0;overflow-wrap:anywhere}
.msg.u{background:var(--accent-soft);color:var(--fg);align-self:flex-end;max-width:85%;white-space:pre-wrap}
.msg.a{background:var(--sunken)}
.qref{font:inherit;color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin:0 1px;cursor:pointer;font-weight:500}
.qref:hover{text-decoration:underline}
.msg .meta{font-size:.72rem;color:var(--muted);margin-top:6px}
.md{display:flex;flex-direction:column;gap:6px;min-width:0}
.md p{margin:0}
sub{font-size:.72em;line-height:0;vertical-align:-.2em}
.md ul,.md ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:2px}
.md .mh{font-weight:700}
.md code{font-family:var(--mono);font-size:.85em;background:var(--surface);padding:0 4px;border-radius:3px}
.md pre.code{font-family:var(--mono);font-size:.82rem;background:var(--surface);padding:8px 10px;border-radius:6px;overflow-x:auto;margin:0}
.md .tbl{margin:2px 0}
.thinking{color:var(--muted);font-size:.88rem}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sugs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer}
.sugs button:disabled{opacity:.5;cursor:default}
/* 질문 버튼 3개를 한 줄에 같은 폭으로 */
.ask .sugs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.ask .sugs button{padding:6px 8px;line-height:1.35;text-align:center;word-break:keep-all}
.fcard{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:8px;margin:2px 0}
.fc-t{font-weight:700;font-size:.9rem}
.fc-f{font-size:1.25rem;text-align:center;padding:10px 6px;background:var(--bg);border-radius:8px;overflow-x:auto}
.fc-sym{border-collapse:collapse;font-size:.86rem;width:100%}
.fc-sym td{padding:3px 6px;border-top:1px solid var(--line);vertical-align:baseline}
.fc-sym .fs{font-weight:700;white-space:nowrap;width:1%}
.fc-sym .fu{color:var(--muted);white-space:nowrap;text-align:right;width:1%}
.fc-k{font-size:.72rem;font-weight:700;color:var(--muted)}
.fc-steps{display:flex;flex-direction:column;gap:4px}
.fc-s{padding-left:8px;overflow-x:auto}
.fc-a{font-weight:700;font-size:1rem;background:var(--accent-soft);border-radius:6px;padding:6px 10px}
.fc-tip{font-size:.84rem;color:var(--muted)}
.nc{border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:42vh;overflow:auto}
.nc summary{cursor:pointer;padding:6px 10px;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:6px;position:sticky;top:0;background:var(--surface)}
.nc-body{padding:0 10px 10px}
.nc-empty{margin:0}
.msg.u img.hand{display:block;max-width:100%;max-height:160px;border-radius:6px;background:#fff;margin-bottom:6px}
.askpad-wrap{position:relative;height:170px;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;background-image:linear-gradient(transparent calc(100% - 1px), var(--line) 0);background-size:100% 42px}
.askpad-wrap:has(.erasing){outline:2px dashed var(--bad);outline-offset:-2px}
.askpad-ph{position:absolute;left:12px;top:10px;color:var(--muted);font-size:.85rem;pointer-events:none}
.askf textarea{width:100%;min-height:64px;resize:vertical;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.askf textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}

.lightbox{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

/* 결과 */
.summary{display:flex;flex-direction:column;gap:14px}
.stats.mock-score{grid-template-columns:repeat(3,minmax(0,1fr))}
.rlist{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.rlist button{display:grid;grid-template-columns:8.5rem minmax(0,1fr) auto;gap:12px;width:100%;padding:10px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;align-items:center}
.rlist button:first-child{border-top:0}
.pill{font-size:.75rem;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.v-정답{background:var(--ok-soft);color:var(--ok)} .pill.v-부분정답{background:var(--part-soft);color:var(--part)} .pill.v-오답,.pill.v-확인{background:var(--bad-soft);color:var(--bad)} .pill.v-none{background:var(--sunken);color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .card.has-photo{grid-template-columns:minmax(0,1fr)} .photo img{max-height:300px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .qa{padding:12px}
  .qa > span:not(.row){display:none}
  .qa.main{grid-column:1/-1;order:-1}
  .section header{flex-direction:column;align-items:flex-start;gap:0}
  .qa.main > span:not(.row){display:block}
  .qa .row{width:100%}
  .qa select{width:100%;min-width:0;text-overflow:ellipsis}
  .set{grid-template-columns:minmax(0,1fr) auto}.set .cells{grid-column:1/-1;order:3}
  .kbd{display:none}
  .no-photo .body,.body{padding:16px}
  .qtop, .no-photo .body .qtop{margin:-16px -16px 0;padding:16px 16px 10px;max-height:38vh}
  .ask{padding:14px 16px}
  .checks button{grid-template-columns:minmax(0,1fr)}
  .rlist button{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
  .rlist button > span:first-child{grid-column:1/-1}
  .rlist button > span:nth-child(2){display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
}
@media (prefers-reduced-motion:no-preference){.result{animation:rin .18s ease-out}@keyframes rin{from{transform:translateY(4px)}to{transform:none}}}

/* 직접 채점: 평소엔 거의 안 보이게 */
details.selfmini{align-self:flex-end;font-size:.72rem}
details.selfmini summary{cursor:pointer;color:var(--muted);opacity:.45;list-style:none;text-align:right}
details.selfmini summary::-webkit-details-marker{display:none}
details.selfmini[open] summary{opacity:.8}
details.selfmini .self{margin-top:6px}
/* 수기 채점 화면 */
.manual{max-width:820px;margin-inline:auto;width:100%}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.mcard.done{opacity:.6}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.mgrid img{width:150px;border-radius:8px;background:var(--photo)}
.mgrid .mans:only-child{grid-column:1/-1}
.mk{font-size:.75rem;font-weight:700;color:var(--muted);margin-top:4px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:.95rem;background:var(--accent-soft);border-radius:6px;padding:4px 10px;margin-top:3px}
.mrow .tag{font-weight:700}
.mb{min-width:72px;padding:8px 14px;font-size:.9rem}
.mb.ok.on,.mb.ok:hover{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mb.part.on,.mb.part:hover{background:var(--part-soft);border-color:var(--part);color:var(--part)}
.mb.bad.on,.mb.bad:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.mfoot{position:sticky;bottom:0;background:var(--bg);padding:12px 0}
@media (max-width:760px){ .mgrid{grid-template-columns:minmax(0,1fr)} .mgrid img{width:100%;max-height:200px;object-fit:contain} }
/* 기록 공유 상태 */
.sync.off{color:var(--bad)} .sync.off i{background:var(--bad)}
.peers{font-size:.75rem;color:var(--muted);margin-top:2px}
.syncwarn{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:.85rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.syncwarn b{font-weight:700}

/* 위키 링크(파란 단어) · 해설 */
a.wl{color:var(--link);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--link) 35%,transparent);cursor:pointer}
a.wl:hover{border-bottom-color:var(--link)}
a.wl.new{color:var(--bad);border-bottom-style:dashed}
details.exp{border:1px solid var(--line);border-left:4px solid var(--link);border-radius:8px;background:var(--surface);padding:10px 14px}
details.exp summary{cursor:pointer;font-weight:700;font-size:.9rem}
details.exp summary span{color:var(--muted);font-weight:400}
.exp-body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin-top:8px;font-size:.9rem;line-height:1.7}
.exp-k{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap;padding-top:3px}
.exp-src{font-size:.8rem;color:var(--muted)}

/* 가스 위키 */
.wiki{display:flex;flex-direction:column;gap:14px}
.wbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5;border-bottom:1px solid var(--line)}
.crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:.8rem;color:var(--muted)}
.crumbs button{border:0;background:none;padding:2px 4px;color:var(--link);cursor:pointer;font-size:.8rem}
.crumbs button:last-of-type{color:var(--fg);font-weight:700}
.wdoc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.wdoc h1{font-size:1.6rem;border-bottom:2px solid var(--link);padding-bottom:6px}
.wmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.wcat{border:1px solid var(--line);border-radius:999px;padding:0 8px;background:var(--bg);cursor:pointer;font-size:.75rem;color:var(--fg)}
.wbadge{font-size:.72rem;border-radius:4px;padding:1px 6px;background:var(--sunken);color:var(--muted)}
.wbadge.ai{background:var(--bad-soft);color:var(--bad)}
.wsum{background:var(--sunken);border-radius:8px;padding:10px 14px;font-weight:500}
.toc{border:1px solid var(--line);border-radius:8px;padding:10px 16px;background:var(--bg);display:flex;flex-direction:column;gap:2px;align-self:flex-start;min-width:200px;max-width:100%}
.toc b{font-size:.85rem}
.toc a{color:var(--link);text-decoration:none;font-size:.88rem}
.wsec h2{font-size:1.15rem;border-bottom:1px solid var(--line);padding-bottom:4px;margin:6px 0 8px;scroll-margin-top:110px}
.wsec h2 .no{color:var(--link);margin-right:6px}
.wsec .md{font-size:.95rem;line-height:1.8}
.wsec h3{font-size:1rem;margin:4px 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gal button{border:1px solid var(--line);border-radius:8px;background:var(--photo);padding:0;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.gal img{width:100%;height:110px;object-fit:cover;display:block}
.gal span{font-size:.7rem;color:#fff;background:var(--scrim);padding:2px 6px;text-align:left}
.wq{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.wq button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;text-align:left;border:0;border-top:1px solid var(--line);background:var(--surface);padding:8px 12px;cursor:pointer;font-size:.85rem}
.wq button:first-child{border-top:0}
.wq .meta{color:var(--muted);white-space:nowrap;font-size:.78rem}
.fns{font-size:.82rem;color:var(--muted);padding-left:1.6em;margin:0;display:flex;flex-direction:column;gap:2px}
.fns li.hl{background:var(--accent-soft)}
sup.fnref a{color:var(--link);text-decoration:none;font-size:.78em;padding:0 1px}
.tmpl{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tmpl .th{background:var(--link);color:#fff;font-weight:700;font-size:.85rem;padding:6px 12px}
.tmpl .tb{padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.88rem}
.windex{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.wcard{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.wcard h3{margin:0;font-size:.9rem}
.wcard .tb{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.88rem}
.wmissing{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.wnote{font-size:.8rem;color:var(--muted)}
.wredir{font-size:.8rem;color:var(--muted);margin:0}
/* 문제 풀이 중 위키: 오른쪽 Claude 칸 자리에(폰은 아래에서 올라오는 창) */
.ask.wikip{gap:8px}
.wph{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wpbody{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.ask.wikip .wdoc{border:0;padding:4px 2px;background:transparent;gap:12px}
.ask.wikip .wdoc h1{font-size:1.3rem}
.ask.wikip .gal{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.ask.wikip .wsec h2{scroll-margin-top:8px}
@media (min-width:1100px){ .solve > .ask.wikip .wpbody{flex:1} }
@media (max-width:1099px){
  .ask.wikip{position:fixed;left:0;right:0;bottom:0;height:62vh;z-index:14;border-radius:14px 14px 0 0;border-width:1px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);margin:0!important;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .ask.wikip .wpbody{flex:1}
  body.wikipanel .solve-main{padding-bottom:62vh}
}
/* 위키 읽기 편하게: 글줄 폭 제한, 문단·항목 간격, 핵심어 형광펜, 목차는 한 줄 칩 */
.wiki{max-width:820px;margin-inline:auto;width:100%}
.wdoc{gap:18px;padding:26px 30px}
.wsec{display:flex;flex-direction:column;gap:10px}
.wsec h2{font-size:1.2rem;margin:14px 0 2px;padding:0 0 6px;border-bottom:2px solid var(--line)}
.wsec .md{font-size:1rem;line-height:1.85;gap:12px}
.wsec .md ul,.wsec .md ol{gap:9px;padding-left:1.25em}
.wsec .md li{padding-left:2px}
.wsec .md li::marker{color:var(--link)}

<script id="core">
/* ═════════ 핵심 로직(화면과 무관): 정규화 · 채점 · 수식/글 표시 ═════════ */
const escH = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
/* 화면 글자용: ₀~₉ 아래첨자를 <sub>로 (글꼴에 없는 글자는 다른 글꼴로 대체돼 높이가 어긋남) */
const subFix = h => String(h).replace(/[₀-₉]+/g, m => `<sub>${[...m].map(c => c.charCodeAt(0) - 0x2080).join("")}</sub>`);
const escT = s => subFix(escH(s));
/* 출처 표시: 숫자면 '교재 N쪽', 아니면 그대로(예: Claude 작성, 수험생 복원) */
const srcLabel = v => { v = String(v ?? "").trim(); return !v || v === "—" ? "" : /^[\d\s~,\-–]+$/.test(v) ? `교재 ${v}쪽` : v; };

/* 답 비교용 정규화: 표기 차이를 지우고 소수점은 지킨다 */
const PUA = "";
function norm(s){
  let t = String(s ?? "").normalize("NFKC").toLowerCase();   // ㎥→m3, m²→m2, ₂→2, ℃→°c, 전각→반각
  t = t.replace(/[‐-―−﹣]/g, "-");
  t = t.replace(/⁄/g, "/");
  t = t.replace(/->|=>|[⟶➔➝⇒]/g, "→");
  t = t.replace(/[≒≈]/g, "");
  t = t.replace(/≥/g, "이상").replace(/≤/g, "이하");
  t = t.replace(/[×*]/g, "x");
  t = t.replace(/kgf/g, "kg").replace(/mmaq/g, "mmh2o").replace(/퍼센트/g, "%");
  t = t.replace(/(\d)\s*(?:ohm|옴)/g, "$1ω");
  t = t.replace(/(\d)\s*도(?![가-힣])/g, "$1c").replace(/(\d)\s*도(?=이상|이하|미만|초과)/g, "$1c");
  t = t.replace(/°/g, "");
  t = t.replace(/(\d)\s*(?:센티미터|센티)/g, "$1cm").replace(/(\d)\s*(?:밀리미터|밀리)/g, "$1mm")
       .replace(/(\d)\s*미터/g, "$1m").replace(/(\d)\s*킬로그램/g, "$1kg").replace(/(\d)\s*리터/g, "$1l").replace(/(\d)\s*톤/g, "$1t");
  t = t.replace(/(\d)\.(?=\d)/g, "$1" + PUA);
  t = t.replace(/(\d)\s*-\s*(?=\d)/g, "$1~");
  t = t.replace(/([a-z가-힣])-(?=[a-z가-힣])/g, "$1");
  t = t.replace(/[\s,.·ㆍ・•∙()\[\]{}「」『』〈〉《》<>'"“”‘’`!?;^]/g, "");
  return t.split(PUA).join(".");
}

/* 데이터 준비: 비교용 값을 미리 계산 */
function compileItem(it){
  it._a = new Set([...(it.a || []), it.t].map(norm).filter(Boolean));
  it._k = (it.k || []).map(g => (Array.isArray(g) ? g : [g]).map(norm).filter(Boolean)).filter(g => g.length);
  it._x = (it.x || []).map(norm).filter(Boolean);
  return it;
}
/* 책 모범답안 자체도 정답 목록에 넣는다('A → B 또는 C → D'처럼 반응식이 둘이면 각각도) */
function answerForms(p){
  const a = String(p.answer || "").trim();
  if (!a || p.pick || / 중 하나$/.test(a)) return [];
  const alts = a.split(/\s+또는\s+/);
  return alts.length > 1 && alts.every(x => x.includes("→")) ? [a, ...alts] : [a];
}
function compileQ(q){
  for (const p of q.parts || []){
    p._acc = new Set([...(p.accept || []), ...answerForms(p)].map(norm).filter(Boolean));
    p._keys = (p.keys || []).map(g => g.map(norm).filter(Boolean)).filter(g => g.length);
    p._deny = (p.deny || []).map(norm).filter(Boolean);
    (p.alts || []).forEach(a => { a._keys = (a.keys || []).map(g => g.map(norm).filter(Boolean)).filter(g => g.length); });
    if (p.set) p.set.opts.forEach(o => { o._k = (o.k || [o.t]).map(norm).filter(Boolean); });
  }
  for (const pool of Object.values(q.pools || {})){ (pool.items || []).forEach(compileItem); (pool.extra || []).forEach(compileItem); }
  return q;
}
/* 키 일치: 묶음마다 하나 이상 들어 있고, 반대말(x)은 없어야 한다 */
const keysHit = (keys, deny, n) => keys.length > 0 && !deny.some(x => n.includes(x)) && keys.every(g => g.some(k => n.includes(k)));
/* 키워드만 맞고 뜻이 뒤집힌 답 거르기: 키워드로 정답 처리하기 전에 확인.
   ① 부정(없다·않다·못·불가)이 모범답안과 다르게 들어가면 ② 모범답안의 이상/이하/미만/초과가 답에 없거나 다른 것이면
   → 화면에서 정답 처리하지 않고 Claude 채점으로 넘김 */
const NEG = /없|않|못|불가|아니|아님|말것|말아|금지/;
/* 모범답안 쪽은 '~않을 것/~없다'처럼 문장 끝 부정만 셈('이음매 없는 용기'≒'무이음용기'는 그대로 인정) */
const NEG_END = /(않|없|못)(다|음|을것|는다|게할것|도록할것|도록한다)$|말것$|금지$/;
const CMPS = ["이상", "이하", "미만", "초과"];
/* 이상/이하 등은 띄어쓰기를 살린 글에서 찾음('압력이 상한' 붙여 쓰면 '이상'이 생기는 오판 방지) */
const cmpOf = t => { const r = String(t ?? "").normalize("NFKC").replace(/≥/g, "이상").replace(/≤/g, "이하"); return CMPS.filter(c => r.includes(c)); };
function sameSense(model, n, raw){
  const m = norm(model);
  if (NEG.test(n) && !NEG.test(m)) return false;
  if (NEG_END.test(m) && !NEG.test(n)) return false;
  const need = cmpOf(model), got = cmpOf(raw ?? n);
  if (need.some(c => !got.includes(c))) return false;
  if (need.length && got.some(c => !need.includes(c))) return false;
  return true;
}
const itemMatch = (it, n, raw) => !!n && (it._a.has(n) || (keysHit(it._k, it._x, n) && sameSense(it.t, n, raw)));

/* 여러 가스를 한 칸에 쓰는 문제: 보기 이름을 긴 것부터 찾아 정답 목록과 비교 */
function gradeSet(p, n, raw){
  /* 쉼표·띄어쓰기로 나눈 낱말마다 보기와 맞춰 봄. 영문 화학식은 정확히 같아야 함(C2H2 안의 H2를 수소로 보지 않게) */
  const toks = String(raw ?? "").replace(/^\s*[\[(]?\d+[\])]\s*/, "").split(/[,，、\/·;\s]+|(?<=[가-힣])(?:와|과|및)(?=\s)/).map(norm).filter(Boolean);
  const found = new Set(), unknown = [];
  for (const t of toks){
    let hit = p.set.opts.find(o => o._k.includes(t));
    if (!hit && /[가-힣]/.test(t)){
      let best = null, bl = 0;
      for (const o of p.set.opts) for (const k of o._k) if (/[가-힣]/.test(k) && k.length >= 2 && t.includes(k) && k.length > bl){ best = o; bl = k.length; }
      hit = best;
    }
    if (hit) found.add(hit.t); else if (!/^\d+$/.test(t)) unknown.push(t.replace(/[a-z]+\d*/g, m => m.toUpperCase()));
  }
  if (!found.size) return null;
  const ans = new Set(p.set.ans);
  const miss = [...ans].filter(t => !found.has(t)), extra = [...found].filter(t => !ans.has(t));
  if (!miss.length && !extra.length && !unknown.length) return {verdict:"정답", reason:""};
  const ok = [...found].filter(t => ans.has(t)).length;
  const reason = [miss.length ? `빠진 것: ${miss.join(", ")}` : "", extra.length ? `틀린 것: ${extra.join(", ")}` : "", unknown.length ? `보기에 없는 것: ${unknown.join(", ")}` : ""].filter(Boolean).join(" / ");
  return {verdict: ok ? "부분정답" : "오답", reason};
}

/* 'N가지 중 a가지' 칸: 칸마다 서로 다른 정답에 짝지어야 정답(같은 답 두 번은 오답) */
function gradePool(pool, idxs, ns, raws = ns){
  const all = [...(pool.items || []), ...(pool.extra || [])];
  const cand = idxs.map(i => all.map((it, j) => itemMatch(it, ns[i], raws[i]) ? j : -1).filter(j => j >= 0));
  const owner = new Array(all.length).fill(-1);
  const tryAssign = (p, seen) => {
    for (const j of cand[p]){
      if (seen.has(j)) continue; seen.add(j);
      if (owner[j] < 0 || tryAssign(owner[j], seen)){ owner[j] = p; return true; }
    }
    return false;
  };
  idxs.forEach((_, p) => tryAssign(p, new Set()));
  const got = new Array(idxs.length).fill(-1);
  owner.forEach((p, j) => { if (p >= 0) got[p] = j; });
  return idxs.map((i, p) => ({i, item: got[p], cand: cand[p]}));
}

/* 계산·수치 문제: 숫자가 모범답안과 1% 넘게 다르면 Claude에게 묻지 않고 바로 오답 */
const numsOf = n => (String(n).replace(/([a-z])\d+/g, "$1").match(/\d+(?:\.\d+)?/g) || []).map(Number);
function numMismatch(p, n){
  if (p.long || p.pick || p.set || !/^\s*[−\-]?\d/.test(p.answer || "")) return "";
  const a = numsOf(norm(p.answer));
  if (a.length !== 1) return "";
  const got = numsOf(n);
  if (!got.length) return "";
  const close = x => Math.abs(x - a[0]) <= Math.max(Math.abs(a[0]) * 0.01, 1e-9);
  return got.some(close) ? "" : `수치가 모범답안(${p.answer})과 다릅니다`;
}

/* 식으로 쓴 답(7/13, 70÷130, 0.5385 등)의 값이 모범답안과 같은지: 같으면 안내 문구, 아니면 "" */
function evalExpr(src){
  const t = src.replace(/÷/g, "/").replace(/\s+/g, "");
  let i = 0;
  const num = () => { const m = t.slice(i).match(/^\d+(?:\.\d+)?/); if (!m) throw 0; i += m[0].length; return Number(m[0]); };
  const atom = () => { if (t[i] === "-"){ i++; return -atom(); } if (t[i] === "("){ i++; const v = sum(); if (t[i] !== ")") throw 0; i++; return v; } return num(); };
  const prod = () => { let v = atom(); while (t[i] === "x" || t[i] === "/"){ const o = t[i++]; const r = atom(); v = o === "x" ? v * r : v / r; } return v; };
  const sum = () => { let v = prod(); while (t[i] === "+" || t[i] === "-"){ const o = t[i++]; const r = prod(); v = o === "+" ? v + r : v - r; } return v; };
  const v = sum(); if (i !== t.length || !isFinite(v)) throw 0; return v;
}
function sameValue(p, raw){
  /* 괄호를 살리려고 원래 입력을 가볍게만 다듬어서 씀 */
  const n = String(raw ?? "").normalize("NFKC").toLowerCase().replace(/[‐-―−﹣]/g, "-").replace(/[×*·]/g, "x").replace(/÷/g, "/").replace(/(\d),(?=\d{3}\b)/g, "$1");
  if (p.long || p.pick || p.set || !/^\s*[−\-]?\d/.test(p.answer || "")) return "";
  const a = numsOf(norm(p.answer)); if (a.length !== 1) return "";
  const target = /^\s*[−\-]/.test(p.answer) ? -a[0] : a[0];
  const pct = /%/.test(p.answer);
  /* 답에서 식 부분만(뒤에 붙은 % · 단위 · '=' 뒤 값은 떼고) */
  const expr = String(n).split("=")[0].replace(/[%a-z가-힣°℃·²³\s]+$/g, "").trim();
  if (!/^[\d.+\-x/÷()\s]+$/.test(expr)) return "";
  let v; try { v = evalExpr(expr); } catch(e) { return ""; }
  const close = x => Math.abs(x - target) <= Math.max(Math.abs(target) * 0.01, 1e-9);
  const isPlain = /^\d+(?:\.\d+)?$/.test(expr);
  if (close(v) && !isPlain) return `값은 맞습니다(${+v.toFixed(4)}). 시험에서는 계산한 최종값 ${p.answer}로 써야 만점입니다`;
  if (pct && close(v * 100)) return `값은 맞습니다(${+v.toFixed(4)} = ${+(v * 100).toFixed(2)}%). 문제 단위가 [%]라서 ×100 한 ${p.answer}로 써야 만점입니다`;
  return "";
}

/* 화면 채점: 정답/부분정답/오답이 정해지면 그 값, 판단이 어려우면 null(→ Claude) */
function gradeLocal(q, inputs){
  const ns = inputs.map(norm);
  const out = q.parts.map(p => ({label: p.label, verdict: null, reason: ""}));
  q.parts.forEach((p, i) => {
    if (p.pick) return;
    if (!ns[i]){ out[i].verdict = "오답"; out[i].reason = "빈칸"; return; }
    if (p._acc.has(ns[i])){ out[i].verdict = "정답"; return; }
    if (p.set){ const r = gradeSet(p, ns[i], inputs[i]); if (r){ out[i].verdict = r.verdict; out[i].reason = r.reason; return; } }
    const alt = (p.alts || []).find(a => keysHit(a._keys, p._deny, ns[i]) && sameSense(p.answer, ns[i], inputs[i]));
    if (alt){ out[i].verdict = alt.verdict || "정답"; out[i].reason = alt.reason || ""; return; }
    if (keysHit(p._keys, p._deny, ns[i]) && sameSense(p.answer, ns[i], inputs[i])){ out[i].verdict = "정답"; return; }
    const same = sameValue(p, inputs[i]);
    if (same){ out[i].verdict = "부분정답"; out[i].reason = same; return; }
    const wrong = numMismatch(p, ns[i]);
    if (wrong){ out[i].verdict = "오답"; out[i].reason = wrong; }

  for (const [pid, pool] of Object.entries(q.pools || {})){

function questionBrief(q, set, rec){
  const L = [`[문제 자료] ${set.section} ${set.title} ${q.no}번 (${srcLabel(q.page || set.pages)})${q.img ? " · 사진 문제" : ""}`, `문제: ${q.prompt}`];
  if (q.ctx) L.push(`지문/소문항:\n${q.ctx}`);
  if (q.vnote) L.push(`동영상 설명: ${q.vnote}`);
  L.push("모범답안:");
  q.parts.forEach(p => { if (!p.pick) L.push(`- ${p.label}: ${p.answer}`); });
  poolLines(q).forEach(x => L.push(`- ${x}`));
  if (q.theory){
    const t = q.theory;
    L.push(`관련 이론: ${t.title || ""}`);
    if (t.head) L.push(t.head.join(" | "));
    (t.rows || []).forEach(r => L.push(r.join(" | ")));
    if (t.text) L.push(t.text);
  }
  if (q.note) L.push(`참고: ${q.note}`);
  if (q.flag) L.push(`(자료 메모: ${q.flag})`);
  if (rec && rec.a && rec.a.some(x => x)){
    L.push("학습자가 쓴 답:");
    q.parts.forEach((p, i) => L.push(`- ${p.label}: ${rec.a[i] || "(빈칸)"}`));
    if (rec.v) L.push(`채점 결과: ${rec.v === "확인" ? "답을 확인만 함" : rec.v}`);
  }
  return L.join("\n");
}

/* 설정(회독·모의고사 진행·시험일) 합치기: 두 계정·두 기기가 번갈아 써도 서로 덮어쓰지 않게.
   회독은 번호가 큰 쪽(같으면 나중 시작), 모의고사 회독은 회차가 큰 쪽(같으면 푼 문제 합집합), 시험일은 나중에 바꾼 쪽 */
function mergeSettings(a, b){
  a = a || {}; b = b || {};
  const out = {...b, ...a};
  if ((b.examAt || 0) > (a.examAt || 0)){ out.exam = b.exam; out.examAt = b.examAt; }
  else if (!a.exam && b.exam){ out.exam = b.exam; out.examAt = b.examAt; }
  const ra = a.rounds || {}, rounds = {...(b.rounds || {})};
  for (const [k, v] of Object.entries(ra)){ const w = rounds[k]; if (!w || (v.no || 0) > (w.no || 0) || ((v.no || 0) === (w.no || 0) && (v.at || 0) >= (w.at || 0))) rounds[k] = v; }
  if (Object.keys(rounds).length) out.rounds = rounds;
  const ca = a.cyc || {}, cb = b.cyc || {}, cyc = {};
  for (const k of new Set([...Object.keys(ca), ...Object.keys(cb)])){
    const x = ca[k], y = cb[k];
    if (!x || !y){ cyc[k] = clone(x || y); continue; }
    if ((x.n || 1) !== (y.n || 1)) cyc[k] = clone((x.n || 1) > (y.n || 1) ? x : y);
    else cyc[k] = {n: x.n || 1, done: [...new Set([...(x.done || []), ...(y.done || [])])]};
  }
  if (Object.keys(cyc).length) out.cyc = cyc;
  return out;
}
const Store = {
  mode:"local", db:null, prog:{}, settings:{}, remote:{}, queues:{}, err:"", tries:0, timer:null,
  async init(){
    /* 이 브라우저에 남은 기록으로 먼저 채워 두고, 공용 기록장에 붙으면 합쳐서 올림 */

      /* 10초 안에 기록이 안 오면 멈춰 있지 말고 이 브라우저 기록으로 시작(뒤에서 계속 다시 연결) */

      }

      if (JSON.stringify(ms) !== JSON.stringify(this.settings)){ this.settings = ms; this.saveSettings(); }
      db.collection("progress").onSnapshot(sn => {
        sn.docs.forEach(d => { if (!this.queues[d.id]?.busy) this.prog[d.id] = mergeSet(this.prog[d.id], clone(d.data())); });
        onRemoteChange();
      }, () => {});

  },
  /* 연결 실패 시 뒤에서 계속 다시 시도: 15초 → 최대 2분 간격 */
  retry(now){
    clearTimeout(this.timer);
    const wait = now ? 0 : Math.min(15000 * Math.pow(1.5, this.tries), 120000);
    this.timer = setTimeout(async () => {
      this.tries++;
      if (await this.connect()){ toast("공용 기록장에 연결했습니다. 이 기기에서 푼 기록도 합쳤어요."); render(); }
      else { if (view === "home") render(); this.retry(); }
    }, wait);
  },
  rec(id){ const [s, n] = id.split("#"); return this.prog[s]?.["q" + n]; },
  put(id, rec){ const [s, n] = id.split("#"); this.prog[s] = {...(this.prog[s] || {}), ["q" + n]: clone(rec)}; this.flush(s); },
  flush(setId){

      .finally(() => { q.busy = false; if (q.again){ q.again = false; this.flush(setId); } });
  },
  saveSettings(){
    if (this.mode === "db") this.settings = mergeSettings(this.settings, this.remote);
    lsSet(LOCAL_KEY, {prog:this.prog, settings:this.settings});
    if (this.mode === "db") this.db.doc("settings/main").set(this.settings).catch(() => toast("설정을 저장하지 못했습니다."));
  }
};
/* 이 기록장을 쓰는 계정 표시: 계정마다 마지막 접속 시각을 남겨 홈에서 '같이 쓰는 계정'으로 보여 줌 */
const Presence = {
  db:null, me:"", user:null, list:{}, names:{}, last:0,

/* 교재 표: 합쳐진 칸이 빈칸("")으로 들어 있음 → 줄 앞 빈칸은 위 칸과(rowspan), 줄 끝 빈칸은 왼쪽 칸과(colspan) 합쳐 그림 */
function spanTable(head, rows){
  const blank = v => !String(v ?? "").trim();
  const short = v => String(v ?? "").length <= 10 ? ' class="nw"' : "";
  let th = "";
  if (head){
    const hs = [];
    head.forEach((v, j) => { if (blank(v) && hs.length) hs[hs.length - 1].cs++; else hs.push({v, cs: 1}); });
    th = `<thead><tr>${hs.map(c => `<th${c.cs > 1 ? ` colspan="${c.cs}"` : ""}>${mathInline(c.v, true)}</th>`).join("")}</tr></thead>`;
  }
  const owner = [], grid = rows.map((r, i) => {
    const f = r.findIndex(v => !blank(v));
    let L = r.length - 1; while (L > 0 && blank(r[L])) L--;
    return r.map((v, j) => {
      if (i > 0 && f > 0 && j < f && owner[j]){ owner[j].rs++; return null; }      // 위 칸과 합침
      if (f >= 0 && j > L){ return "R"; }                                             // 왼쪽 칸과 합침
      const c = {v, rs: 1, cs: 1}; owner[j] = c; return c;
    });
  });
  grid.forEach(r => r.forEach((c, j) => { if (c === "R"){ let k = j - 1; while (k >= 0 && (r[k] === "R" || r[k] === null)) k--; if (k >= 0) r[k].cs++; } }));
  const body = grid.map(r => `<tr>${r.filter(c => c && c !== "R").map(c => `<td${c.rs > 1 ? ` rowspan="${c.rs}"` : ""}${c.cs > 1 ? ` colspan="${c.cs}"` : ""}${short(c.v)}>${rich(c.v)}</td>`).join("")}</tr>`).join("");
  return `<div class="tbl ttbl"><table>${th}<tbody>${body}</tbody></table></div>`;
}

/* 채점. silent=true는 '다음'을 눌러 넘어가면서 뒤에서 채점하는 경우(빈칸이면 조용히 건너뜀).
   화면을 다른 문제로 옮겨도 끝까지 채점하고 기록하며, 그 문제를 보고 있을 때만 화면에 결과를 그림 */
const grading = new Set();
let aiDownUntil = 0;
function answersOf(id){
  const {q} = QI.get(id);

function needsGrade(id){
  if (QI.get(id).q.choices) return false;
  const {q} = QI.get(id), now = answersOf(id).map(x => (x || "").trim());
  const ink = session?.ink?.[id], inkDirty = inkOn && hasInk(id) && ink.readVer !== ink.ver;
  if (!now.some(Boolean) && !inkDirty) return false;                 // 아무것도 안 씀
  const cur = sres(id);

}
async function grade(id, silent = false){
  if (QI.get(id).q.choices) return;
  if (grading.has(id)) return;
  grading.add(id);
  const {q} = QI.get(id), here = () => isCurrent(id);
  const busy = (on, label) => { if (!here()) return; const g = $("grade"); if (g){ g.disabled = on; g.textContent = on ? label : "채점"; } };
  const waitBox = msg => { if (here()) $("res").innerHTML = `<div class="result v-wait"><div class="verdict">${msg}</div></div>`; };
  const tag = `${q.no}번`;
  try {
    let a = answersOf(id).map(x => (x || "").trim()), fromInk = false;
    if (inkOn && hasInk(id)){
      const ink = inkOf(id);
      const typed = a.some((v, i) => v && v !== (ink.auto?.[i] || "").trim());
      if (ink.readVer !== ink.ver && !typed){
        if (!sample || sampleOff || !imageOK){ toast("손글씨 읽기는 Claude 앱에서 열었을 때만 됩니다. '정답 보기'로 직접 비교하세요."); return; }
        busy(true, "손글씨 읽는 중…"); waitBox(`${MODEL_GRADE.name}가 손글씨를 읽는 중…`);
        try {
          const texts = await readInk(id, q);
          if (texts){ fromInk = true; a = texts.map(t => (t || "").trim()); Drafts.set(id, texts); if (here()) texts.forEach((t, i) => { const el = $("a-" + i); if (el) el.value = t; }); }
        } catch(e) {
          if (OFF_CODES.includes(e?.code)) sampleOff = e.code;
          if (e?.code === "images_unavailable") imageOK = false;
          console.warn("손글씨 읽기 실패", e);
          if (here()) $("res").innerHTML = "";
          toast((silent ? tag + " " : "") + (e?.code === "invalid_json" ? "손글씨를 읽지 못했습니다. 다시 채점을 누르거나 아래 칸에 직접 적어 주세요." : sampleErrorText(e)));
          return;
        }
      }
    }
    if (a.every(x => !x)){ if (!silent){ toast("답을 입력한 뒤 채점하세요. 모르면 '정답 보기'를 누르세요."); if (!inkOn) $("a-0")?.focus(); } return; }
    const local = gradeLocal(q, a);
    const strip = l => l.map(p => ({label:p.label, verdict:p.verdict, reason:p.reason, ...(Number.isInteger(p.item) ? {item:p.item} : {})}));
    const done0 = rec => { if (here()) showResult(id, rec); else { renderMap(); renderScore(); if (view === "done") render(); } };
    const done = rec => { if (fromInk || (inkOn && hasInk(id))){ rec.ink = 1; Store.put(id, rec); if (session?.res?.[id]) session.res[id] = rec; } return done0(rec); };
    if (local.every(p => p.verdict)) return done(record(id, {v:overall(local), how:"local", a, parts:strip(local)}));
    if (!sample || sampleOff || aiDownUntil > Date.now()){
      const parts = strip(local).map(p => p.verdict ? p : {...p, verdict:"확인", reason:"모범답안과 직접 비교하세요"});
      return done(record(id, {v:"확인", how:"view", a, parts}));
    }
    busy(true, "채점 중…"); waitBox(`${MODEL_GRADE.name}가 채점하는 중…`);
    try {
      /* 채점 응답이 90초 넘게 없으면 이 문제만 직접 채점으로 넘김(처음 허용 창이 떠 있을 수 있어 넉넉히) */
      const {parts, model} = await Promise.race([gradeWithClaude(q, a, local), new Promise((_, rej) => setTimeout(() => rej({code: "timeout"}), 90000))]);
      done(record(id, {v:overall(parts), how:"ai", model, a, parts:strip(parts).map((p, i) => ({...p, missing:parts[i].missing}))}));
    } catch(e) {
      if (OFF_CODES.includes(e?.code)) sampleOff = e.code;
      if (e?.code === "rate_limited") aiDownUntil = Date.now() + 5 * 60 * 1000;   // 사용량 한도일 때만 잠시 끔. 시간 초과·일시 오류는 이 문제만 수기 채점
      /* 안내 문구 없이 '직접 채점 대기'로만 남김 → 끝에서 수기 채점 화면이 모아서 보여 줌 */
      done(record(id, {v:"확인", how:"view", a, parts: strip(local).map(p => p.verdict ? p : {...p, verdict:"확인", reason:""})}));
    }
  } finally { grading.delete(id); busy(false); }
}

/* ───────── Claude가 문제은행을 조회하는 도구 (오른쪽 채팅에서만) ─────────
   ref = 세트id#번호 (예: w2024-3#5). 결과는 작게 잘라서 돌려줌 */
const refName = id => { const x = QI.get(id); return x ? `${x.set.section} ${x.set.title} ${x.q.no}번` : id; };
function recSummary(id){
  const r = Store.rec(id); if (!r) return "안 풂";
  const bits = [r.v ? `최근 ${r.v === "확인" ? "답만 확인" : r.v}` : "안 풂"];
  if (r.wrong) bits.push(`틀린 횟수 ${r.wrong}`);
  const sn = starN(r); if (sn) bits.push(`별표 ${sn}`);

const shortAns = q => q.parts.filter(p => !p.pick).map(p => p.answer).concat(poolLines(q)).join(" / ").slice(0, 140);
function bankTools(curId){
  const norm = t => String(t || "").toLowerCase().replace(/[\s·,()\[\]₀-₉]/g, m => "₀₁₂₃₄₅₆₇₈₉".includes(m) ? String("₀₁₂₃₄₅₆₇₈₉".indexOf(m)) : " ");

    if (inp.group && (set.group || "기출문제") !== String(inp.group)) return false;
    return true;
  });
  return [
    {name: "search_questions",
     description: "이 연습장의 문제은행(필기·작업형 852문제)에서 키워드로 문제를 찾습니다. 문제·지문·정답·이론 글에서 찾고, 일치가 많은 순으로 ref·이름·문제 앞부분·정답 요약·학습자 기록을 돌려줍니다. 키워드 없이 section/year/round만 주면 그 회차 목록을 돌려줍니다.",
     inputSchema: {type: "object", properties: {
       query: {type: "string", description: "띄어쓰기로 나눈 키워드. 예: '방류둑 저장능력', '오리피스'"},
       section: {type: "string", enum: ["필기", "작업형"]},
       group: {type: "string", enum: ["기출문제", "출제예상문제", "암기카드"]},
       year: {type: "integer"}, round: {type: "integer"},
       limit: {type: "integer", description: "최대 개수, 기본 8, 최대 15"}}},
     execute(inp){
       const terms = norm(inp.query).split(/\s+/).filter(Boolean);
       const lim = Math.min(Math.max(Number(inp.limit) || 8, 1), 15);
       let rows = filt(inp).filter(id => id !== curId).map(id => {
         const {q} = QI.get(id), hay = norm(qText(q) + " " + (q.theory?.text || "") + " " + (q.theory?.rows || []).flat().join(" "));
         const sc = terms.reduce((t, w) => t + (hay.includes(w) ? 1 + (norm(q.prompt).includes(w) ? 1 : 0) : 0), 0);
         return {id, sc};
       });
       if (terms.length) rows = rows.filter(r => r.sc > 0).sort((a, b) => b.sc - a.sc);
       const total = rows.length;
       return {total, results: rows.slice(0, lim).map(({id}) => { const {q} = QI.get(id); return {ref: id, name: refName(id), prompt: q.prompt.slice(0, 120), answer: shortAns(q), photo: !!q.img, record: recSummary(id)}; })};
     }},
    {name: "get_question",
     description: "ref(예: w2024-3#5, p2023-1#2, e2#4)로 문제 하나의 전체 자료(문제·지문·모범답안·관련 이론)와 학습자 기록·마지막으로 쓴 답을 돌려줍니다. 사진 문제는 사진 대신 글 설명만 있습니다.",
     inputSchema: {type: "object", properties: {ref: {type: "string"}}, required: ["ref"]},
     execute(inp){
       const id = String(inp.ref || "").trim(), x = QI.get(id);
       if (!x) throw new Error("그런 ref가 없습니다. search_questions로 먼저 찾아보세요.");
       return {ref: id, name: refName(id), record: recSummary(id), data: questionBrief(x.q, x.set, Store.rec(id)).slice(0, 6000)};
     }},
    {name: "my_records",
     description: "학습자의 풀이 기록에서 문제를 고릅니다. kind: 'wrong'(최근 틀림/부분정답), 'starred'(별표, 많은 순), 'weak'(약점), 'unsolved'(안 푼 문제). section/year로 좁힐 수 있습니다. ref·이름·문제 앞부분·기록을 돌려줍니다.",
     inputSchema: {type: "object", properties: {
       kind: {type: "string", enum: ["wrong", "starred", "weak", "unsolved"]},
       section: {type: "string", enum: ["필기", "작업형"]}, year: {type: "integer"},
       limit: {type: "integer", description: "기본 10, 최대 20"}}, required: ["kind"]},
     execute(inp){
       const lim = Math.min(Math.max(Number(inp.limit) || 10, 1), 20), k = String(inp.kind);
       let ids = filt(inp);
       if (k === "wrong") ids = ids.filter(id => BAD(Store.rec(id)?.v)).sort((a, b) => (Store.rec(b).t || 0) - (Store.rec(a).t || 0));
       else if (k === "starred") ids = ids.filter(id => starN(Store.rec(id))).sort((a, b) => starN(Store.rec(b)) - starN(Store.rec(a)));

/* ───────── 가스 위키 ─────────
   data/wiki.json(교재·공식 자료 기반, Claude 작성) + 공용 기록장 'wiki' 모음(없는 문서를 누를 때 Claude가 즉석 작성, 검증 전).
   해설·Claude 답·문제 글의 용어를 파란 링크로 바꾸고, 누르면 나무위키처럼 문서 화면으로 넘어감(뒤로 가기로 보던 문제 복귀) */
const wkey = s => String(s || "").normalize("NFKC").toLowerCase().replace(/[\s·ㆍ()\-_/,.]/g, "");
const unent = s => String(s).replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&amp;/g, "&");
const hashId = s => { let h = 2166136261; for (const c of wkey(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return "a" + h.toString(36); };
const Wiki = {
  docs: [], ai: new Map(), byKey: new Map(), re: null, gen: new Map(),
  async load(){
    try { const d = await (await fetch("data/wiki.json", {cache:"no-cache"})).json(); this.docs = Array.isArray(d.docs) ? d.docs : []; }
    catch(e) { this.docs = []; }
    try { for (const [k, v] of Object.entries(lsGet("gas-pilgi-wiki-ai", {}) || {})) if (v?.t) this.ai.set(k, {...v, ai: true}); } catch(e) {}
    this.index();
  },
  index(){
    this.byKey = new Map(); this.re = null;
    const add = (name, doc) => { const k = wkey(name); if (k && !this.byKey.has(k)) this.byKey.set(k, doc); };
    for (const d of this.docs) add(d.t, d);
    for (const d of this.ai.values()) add(d.t, d);
    for (const d of this.docs) (d.al || []).forEach(a => add(a, d));
  },
  all(){ return [...this.docs, ...[...this.ai.values()].filter(d => this.get(d.t) === d)]; },
  count(){ return this.all().length; },
  get(name){ return this.byKey.get(wkey(name)) || null; },
  search(text, n = 8){
    const t = wkey(text); if (t.length < 2) return [];
    return this.all().map(d => ({d, sc: wkey(d.t).includes(t) ? 3 : (d.al || []).some(a => wkey(a).includes(t)) ? 2 : wkey(d.sum).includes(t) ? 1 : 0}))
      .filter(x => x.sc).sort((a, b) => b.sc - a.sc).slice(0, n).map(x => x.d);
  },
  listen(db){
    db.collection("wiki").onSnapshot(sn => {
      sn.docs.forEach(x => { const v = clone(x.data()); if (v?.t && v.body) this.ai.set(x.id, {...v, ai: true}); });
      this.index(); if (view === "wiki") renderWiki(); else if (panelWiki && view === "solve") renderWikiPanel();
    }, () => {});
  },
  async save(doc){
    const id = hashId(doc.t);
    this.ai.set(id, {...doc, ai: true}); this.index();
    try { const o = lsGet("gas-pilgi-wiki-ai", {}) || {}; o[id] = doc; lsSet("gas-pilgi-wiki-ai", o); } catch(e) {}
    if (Store.db) try { await Store.db.doc("wiki/" + id).set(doc); } catch(e) { toast("문서를 공용 기록장에 저장하지 못했습니다. 이 기기에만 남습니다."); }
  }
};
/* 자동 링크용 용어: 문서 제목 + 다른 이름(한글 3자 이상, 영문은 대문자 약어 2자 이상만 — 흔한 짧은 말이 다 파래지지 않게) */
function linkRe(){
  if (Wiki.re !== null) return Wiki.re;
  const ok = (s, title) => { s = String(s || "").trim(); if (!s) return false; if (/^[A-Za-z0-9/₀-₉]+$/.test(s)) return s.length >= 2 && /[A-Z]/.test(s); return title ? s.length >= 2 : s.length >= 3; };
  const terms = [];
  for (const d of Wiki.all()){ if (ok(d.t, true)) terms.push(d.t); (d.al || []).forEach(a => { if (ok(a, false)) terms.push(a); }); }
  const list = [...new Set(terms)].sort((a, b) => b.length - a.length).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  Wiki.re = list.length ? new RegExp(`(?<![A-Za-z])(${list.join("|")})(?![A-Za-z])`, "g") : false;
  return Wiki.re;
}
/* 글 안의 [[용어]]·[[용어|보이는 글]]·각주 [^1] → 링크 (md()로 이미 HTML이 된 글에 적용) */
function wikiMarkup(html, fns){
  return String(html)
    .replace(/\[\[([^\]|]+?)(?:\|([^\]]+?))?\]\]/g, (m, t, label) => { const name = t.trim(); const has = !!Wiki.get(unent(name)); return `<a href="#" class="wl${has ? "" : " new"}" data-w="${name}" title="${has ? "위키 문서로" : "아직 없는 문서 · 누르면 Claude가 작성"}">${label || name}</a>`; })
    .replace(/\[\^(\d+)\]/g, (m, n) => fns ? `<sup class="fnref"><a href="#" data-fn="${n}" data-src="${esc(fns[n - 1] || "")}">${n}</a></sup>` : "");
}
/* 화면에 이미 그려진 글에서 위키 용어를 찾아 처음 한 번씩 파란 링크로 */
function autoLink(root, opt = {}){
  const re = linkRe(); if (!root || !re) return;
  const seen = new Set(opt.skip ? [wkey(opt.skip)] : []);
  root.querySelectorAll("[data-w]").forEach(a => { const d = Wiki.get(a.dataset.w); seen.add(wkey(d ? d.t : a.dataset.w)); });
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement?.closest("a,button,code,pre,input,textarea,label,summary,h1,h2,.rf,.frac,sub,sup,.fc-f,.qhead,.verdict,.exp-src") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes){
    const s = n.nodeValue; if (!s || s.length < 2) continue;
    re.lastIndex = 0; let m, last = 0, frag = null;
    while ((m = re.exec(s))){
      const d = Wiki.get(m[1]); if (!d) continue;
      const k = wkey(d.t); if (seen.has(k)) continue; seen.add(k);
      frag ||= document.createDocumentFragment();
      frag.append(s.slice(last, m.index));
      const a = document.createElement("a"); a.className = "wl"; a.href = "#"; a.dataset.w = d.t; a.textContent = m[1]; a.title = d.sum || "위키 문서로";
      frag.append(a); last = m.index + m[1].length;
    }
    if (frag){ frag.append(s.slice(last)); n.replaceWith(frag); }
  }
}
/* Claude 해설(5칸) */
function expHTML(q){
  if (q.exph) return `<details class="exp" open><summary>해설 <span>· AI 작성 · 참고용</span></summary><div class="pexp">${q.exph}</div></details>`;
  const e = q.exp || EXP[q._sid]?.[String(q.no)];
  if (!e) return "";
  const row = (k, v, cls = "") => v ? `<span class="exp-k">${k}</span><div class="${cls}">${wikiMarkup(refLinks(/\n/.test(String(v)) ? md(String(v)) : mdInline(String(v))))}</div>` : "";
  return `<details class="exp" open><summary>Claude 해설 <span>· 원리로 이해하기</span></summary><div class="exp-body">
    ${row("답안", e.ans)}${row("왜?", e.why)}${row("외우기", e.mem)}${row("함정", e.trap)}${row("근거", e.src, "exp-src")}</div></details>`;
}

/* 위키 화면: 문서 사이를 오가는 기록(wikiStack)과 들어오기 전 화면(wikiFrom) */

/* 이 용어가 나오는 문제(작업형·사진 문제 먼저) */
function relatedQs(d, n = 12){
  const names = [d.t, ...(d.al || [])].map(norm).filter(x => x.length >= 2);
  const fixed = (d.qs || []).filter(id => QI.has(id));
  const hit = [...QI.entries()].filter(([id, {q}]) => !fixed.includes(id) && names.some(k => norm(qText(q)).includes(k)))
    .sort((a, b) => (b[1].set.section === "작업형") - (a[1].set.section === "작업형") || (!!b[1].q.img) - (!!a[1].q.img)).map(([id]) => id);
  return [...fixed, ...hit].slice(0, n);
}
function goQuestion(id, list, title){
  const x = QI.get(id); if (!x) return;
  if (wikiFrom?.view === "solve" && session){ wikiFrom = null; wikiStack = []; view = "solve"; jumpTo(id); return; }
  wikiFrom = null; wikiStack = [];
  startSession(`위키 '${title}' 관련 문제`, list, Math.max(0, list.indexOf(id)));
}
function wikiSections(body){
  const out = []; let cur = {h: "", lines: []};
  for (const line of String(body || "").replace(/\r/g, "").split("\n")){
    const m = line.match(/^##\s+(.+)$/);
    if (m){ if (cur.h || cur.lines.join("").trim()) out.push(cur); cur = {h: m[1].trim(), lines: []}; }
    else cur.lines.push(line);
  }
  if (cur.h || cur.lines.join("").trim()) out.push(cur);
  return out;
}

    ${back.length ? `<div class="wnote">이 문서를 가리키는 문서: ${back.map(x => `<a href="#" class="wl" data-w="${esc(x.t)}">${esc(x.t)}</a>`).join(", ")}</div>` : ""}

async function wikiGenerate(title){
  if (!sample || sampleOff){ toast(sampleErrorText({code: sampleOff || "unavailable"})); return; }
  const k = wkey(title);
  if (Wiki.gen.get(k) === "busy") return;
  Wiki.gen.set(k, "busy"); if (view === "wiki") renderWiki(); else if (panelWiki && view === "solve") renderWikiPanel();

  const brief = rel.map(id => { const {q, set} = QI.get(id); return questionBrief(q, set, null).slice(0, 1600); }).join("\n\n---\n\n");
  const prompt = [WIKI_RULES, `문서 제목: ${title}`, `있는 문서: ${Wiki.all().map(d => d.t).join(", ")}`,
    rel.length ? `관련 기출 자료(1순위 근거):\n${brief}` : "관련 기출 자료: 없음(일반 원리 위주로 쓰고 숫자는 쓰지 마세요)",
    'JSON으로만 답하세요: {"sum":"한 줄 정의(40자 안팎)","key":["30초 요약 4줄(답안에 바로 쓸 핵심)"],"body":"## 1. 개요\\n...","fn":["근거1","근거2"],"al":["다른 이름"],"cat":["분류 하나"]}'].join("\n\n");
  try {
    const {out} = await askJSON(prompt, {model: MODEL_TUTOR.model, modelTier: MODEL_TUTOR.tier}, MODEL_TUTOR);
    if (!out || typeof out.body !== "string" || out.body.length < 80) throw {code: "invalid_json"};
    const doc = {t: title, sum: String(out.sum || "").slice(0, 200), key: (Array.isArray(out.key) ? out.key : []).map(String).slice(0, 5), body: out.body.slice(0, 8000), fn: (Array.isArray(out.fn) ? out.fn : []).map(String).slice(0, 12),
      al: (Array.isArray(out.al) ? out.al : []).map(String).slice(0, 8), cat: (Array.isArray(out.cat) ? out.cat : ["Claude 즉석 작성"]).map(String).slice(0, 2), qs: rel, at: Date.now(), by: Presence.me || ""};
