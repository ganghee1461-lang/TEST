  const crumbs = panelWiki.stack.map((x, i) => `<button data-pcrumb="${i}">${esc(x.t || (x.cat ? "분류: " + x.cat : "가스 위키"))}</button>`).join(`<span aria-hidden="true">›</span>`);
  box.classList.add("wikip"); box.setAttribute("aria-label", "가스 위키");
  box.innerHTML = `<header class="wph"><button class="btn primary sm" id="wp-close">← 닫기</button>${panelWiki.stack.length > 1 ? `<button class="btn sm" id="wp-back">뒤로</button>` : ""}<span style="flex:1"></span><button class="btn sm" id="wp-index">위키 대문</button><button class="btn sm" id="wp-full">전체 화면</button></header>
    <nav class="crumbs" aria-label="지나온 문서">${crumbs}</nav>
    <div class="wpbody" id="wpbody">${redirNote(cur, d)}${!cur.t ? wikiIndexHTML(cur.cat) : d ? wikiDocHTML(d) : wikiMissingHTML(cur.t)}</div>`;
  if (d) autoLink($("wdoc"), {skip: d.t});
  const body = $("wpbody");
  $("wp-close").onclick = closeWikiPanel;
  if ($("wp-back")) $("wp-back").onclick = () => { panelWiki.stack.pop(); renderWikiPanel(); };
  $("wp-index").onclick = () => openWikiPanel("");
  $("wp-full").onclick = () => { wikiFrom = {view: "solve", y: window.scrollY, chatY: panelWiki.chatY}; wikiStack = panelWiki.stack.map(x => ({...x})); panelWiki = null; document.body.classList.remove("wikipanel"); view = "wiki"; render(); window.scrollTo(0, 0); };
  box.querySelectorAll("[data-pcrumb]").forEach(b => b.onclick = () => { const i = +b.dataset.pcrumb; panelWiki.stack = panelWiki.stack.slice(0, i + 1); renderWikiPanel(); });
  box.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { panelWiki.stack.push({t: "", cat: b.dataset.cat, y: 0}); renderWikiPanel(); });
  box.querySelectorAll("[data-sec]").forEach(a => a.onclick = e => { e.preventDefault(); $(a.dataset.sec)?.scrollIntoView({behavior: "smooth", block: "start"}); });
  if ($("w-allcat")) $("w-allcat").onclick = () => openWikiPanel("");
  const list = [...box.querySelectorAll("[data-wq]")].map(b => b.dataset.wq).filter((x, i, a) => a.indexOf(x) === i);
  const goQ = id => jumpTo(id);
  box.querySelectorAll("[data-wq]").forEach(b => b.onclick = () => goQ(b.dataset.wq));
  box.querySelectorAll("#wdoc [data-ref]").forEach(b => b.onclick = () => goQ(b.dataset.ref));
  if ($("w-gen")) $("w-gen").onclick = () => wikiGenerate(cur.t);
  if ($("w-regen")) $("w-regen").onclick = () => { if (confirmTwice($("w-regen"), "한 번 더 누르면 다시 씁니다")) wikiGenerate(cur.t); };
  if (body) body.scrollTop = cur.y || 0;
}
function confirmTwice(b, msg){
  if (b.dataset.confirm) return true;
  const old = b.textContent; b.dataset.confirm = "1"; b.textContent = msg;
  setTimeout(() => { if (b.isConnected){ delete b.dataset.confirm; b.textContent = old; } }, 3000);
  return false;
}

/* ───────── 수기 채점: Claude 채점이 안 된 문제를 모아, 내 답과 모범답안을 나란히 보고 직접 판정 ───────── */
function renderManual(){
  const ids = session.manualIds || [];
  const left = () => ids.filter(id => sres(id)?.v === "확인").length;
  const card = id => { const {q, set} = QI.get(id), r = sres(id) || {}, judged = r.v && r.v !== "확인";
    return `<article class="mcard ${judged ? "done" : ""}" data-m="${esc(id)}">
      <div class="mhead"><span class="small muted">${esc(setName(set))} ${q.no}번</span>${judged ? `<span class="pill v-${esc(r.v)}">${esc(r.v)}</span>` : ""}</div>
      <p class="prompt">${escT(q.prompt)}</p>${q.ctx ? `<p class="ctx">${escT(q.ctx)}</p>` : ""}
      <div class="mgrid">${q.img ? `<img src="${esc(q.img)}" alt="" loading="lazy">` : ""}<div class="mans">
        <div class="mk">내가 쓴 답</div>${q.parts.map((p, i) => `<div class="mrow"><span class="tag">${esc(p.label)}</span><span>${(r.a?.[i] || "").trim() ? escT(r.a[i]) : '<span class="muted">(빈칸)</span>'}</span></div>`).join("")}
        <div class="mk">모범답안</div>${modelHTML(q, r)}</div></div>
      <div class="actions"><button class="btn sm mb ok" data-mv="정답">맞음</button><button class="btn sm mb part" data-mv="부분정답">부분</button><button class="btn sm mb bad" data-mv="오답">틀림</button></div>
    </article>`; };
  $("app").innerHTML = `<div class="summary manual">
    <div class="top"><div><h1>직접 채점</h1><p class="small muted">자동 채점이 안 된 ${ids.length}문제입니다. 내 답과 모범답안을 비교해 눌러 주세요.</p></div></div>
    ${ids.map(card).join("")}
    <div class="actions mfoot"><button class="btn primary" id="m-done">결과 보기</button><span class="small muted" id="m-left"></span></div>
  </div>`;
  const upd = () => { const n = left(); $("m-left").textContent = n ? `아직 ${n}문제 남음 (남기면 오답으로 셉니다)` : "모두 채점했습니다"; };
  upd();
  document.querySelectorAll("[data-m]").forEach(c => c.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => {
    const id = c.dataset.m, cur = sres(id) || {}, v = b.dataset.mv;
    const r = cur.v === "확인" ? record(id, {v, how:"self"}) : record(id, {v, how:"self-edit"});
    r.how = "self"; Store.put(id, r); session.res[id] = r;
    c.classList.add("done"); c.querySelectorAll("[data-mv]").forEach(x => x.classList.toggle("on", x === b));
    let pill = c.querySelector(".mhead .pill"); if (!pill){ pill = document.createElement("span"); c.querySelector(".mhead").append(pill); }
    pill.className = "pill v-" + v; pill.textContent = v;
    upd();
    const next = [...document.querySelectorAll(".mcard:not(.done)")][0]; if (next) next.scrollIntoView({block:"center", behavior:"smooth"}); else $("m-done").scrollIntoView({block:"center", behavior:"smooth"});
  }));
  $("m-done").onclick = () => { session.manualDone = true; view = "done"; render(); window.scrollTo(0, 0); };
}

/* ───────── 세션 결과 ───────── */
function renderDone(){
  if (session.mock) session.reveal = true;
  const rows = session.ids.map((id, i) => ({id, i, ...QI.get(id), r:sres(id)}));
  const c = v => rows.filter(x => x.r?.v === v).length;
  const bad = rows.filter(x => BAD(x.r?.v)).map(x => x.id);
  const score = list => { const ok = list.filter(x => x.r?.v === "정답").length, part = list.filter(x => x.r?.v === "부분정답").length; return {n: list.length, ok, part, pct: list.length ? Math.round((ok + part * 0.5) / list.length * 100) : 0}; };
  const secs = session.mock ? [...new Set(rows.map(x => x.set.section))].map(name => ({name, ...score(rows.filter(x => x.set.section === name))})) : [];
  const mockHTML = secs.length ? (() => { const t = score(rows); return `<div class="stats mock-score one"><div class="stat"><div class="k">점수 (${t.n}문제)</div><div class="v">${t.pct}<small>점</small></div><div class="small muted">정답 ${t.ok} / ${t.n} · ${t.pct >= 60 ? "합격선(60점) 넘음" : "합격선 60점까지 " + (60 - t.pct) + "점"}</div></div></div>`; })() : "";
  $("app").innerHTML = `<div class="summary">
    <div class="top"><div><h1>${esc(session.name)}</h1><p class="small muted">${rows.length}문제 중 정답 ${c("정답")} · 오답 ${c("오답") + c("확인")} · 안 푼 문제 ${rows.filter(x => !x.r?.v).length}</p></div></div>
    ${mockHTML}
    <div class="actions">${bad.length ? `<button class="btn primary" id="again">틀린 ${bad.length}문제 다시 풀기</button>` : ""}<button class="btn" id="home">홈으로</button></div>
    <div class="rlist">${rows.map(x => `<button data-i="${x.i}"><span class="small muted">${esc(setName(x.set))} ${x.q.no}번</span><span>${esc(x.q.prompt)}</span><span class="pill v-${esc(x.r?.v || "none")}">${esc(x.r?.how === "peek" ? "정답 봄" : x.r?.v === "확인" ? "오답" : (x.r?.v || "안 품"))}</span></button>`).join("")}</div>
  </div>`;
  $("home").onclick = () => { view = "home"; render(); };
  if ($("again")) $("again").onclick = () => startSession(session.name + " · 다시", bad, 0, {mock: session.mock});
  document.querySelectorAll(".rlist button").forEach(b => b.onclick = () => { view = "solve"; go(+b.dataset.i); });
}

function isCurrent(id){ return view === "solve" && session?.ids[session.i] === id; }
try { sessionStorage.removeItem("gas-pilgi-companion"); localStorage.removeItem("gas-pilgi-sync"); localStorage.removeItem("gas-pilgi-companion-open"); } catch(e) {}

function render(){ document.body.classList.toggle("inking", view === "solve" && inkOn); document.body.classList.toggle("wikipanel", view === "solve" && !!panelWiki); if (view === "home") renderHome(); else if (view === "solve") renderSolve(); else if (view === "wiki") renderWiki(); else if (view === "manual") renderManual(); else renderDone(); }
/* 파란 단어·각주는 어디에 있든 눌러서 위키로 */
document.addEventListener("click", e => {
  const w = e.target.closest("[data-w]");
  if (w && !w.closest("#lb")){ e.preventDefault(); if (view === "solve" && $("ask")) openWikiPanel(w.dataset.w); else openWiki(w.dataset.w); return; }
  const f = e.target.closest("[data-fn]");
  if (f){ e.preventDefault(); showFnPop(f); return; }
  if (!e.target.closest("#fnpop")) closeFnPop();
});

/* ───────── 브라우저 뒤로 가기: 사이트를 떠나지 않고 앱 안에서 한 단계씩 뒤로 ─────────
   (위키 패널 닫기 → 위키 이전 문서 → 풀이에서 홈). 화면을 옮길 때마다 기록을 하나 쌓아 둠 */
function navPush(){ try { history.pushState({gas: Date.now()}, ""); } catch(e) {} }
window.addEventListener("popstate", () => {
  closeFnPop();
  if (!$("lb").hidden){ $("lb").hidden = true; return; }
  if (view === "solve" && panelWiki){ if (panelWiki.stack.length > 1){ panelWiki.stack.pop(); renderWikiPanel(); } else closeWikiPanel(); return; }
  if (view === "wiki"){ wikiBack(); return; }
  if (view === "manual"){ view = "solve"; render(); return; }
  if ((view === "solve" || view === "done") && jumpStack.length){ jumpReturn(); return; }
  if (view === "solve" || view === "done"){ view = "home"; render(); window.scrollTo(0, 0); }
});
/* 그래도 페이지가 새로 열리면(30분 안) 풀던 문제로 복귀 */
const RESUME_KEY = "gas-pilgi-resume";
function saveResume(){ try { if (session) sessionStorage.setItem(RESUME_KEY, JSON.stringify({name: session.name, ids: session.ids, i: session.i, opt: {setId: session.setId, roundAt: session.roundAt, mock: session.mock, cyc: session.cyc}, t: Date.now()})); } catch(e) {} }
function tryResume(){
  try { const r = JSON.parse(sessionStorage.getItem(RESUME_KEY) || "null");
    if (r && Date.now() - r.t < 30 * 60 * 1000 && r.ids?.length && r.ids.every(id => QI.has(id))){ const opt = {}; for (const [k, v] of Object.entries(r.opt || {})) if (v != null) opt[k] = v; startSession(r.name, r.ids, r.i, opt); toast("풀던 문제로 돌아왔습니다."); return true; }
  } catch(e) {}
  return false;
}
/* 출처(각주) 팝업 */
function closeFnPop(){ document.getElementById("fnpop")?.remove(); }
function showFnPop(a){
  closeFnPop();
  const d = document.createElement("div"); d.id = "fnpop"; d.className = "fnpop"; d.setAttribute("role", "tooltip");
  d.innerHTML = `<b>출처 [${esc(a.dataset.fn)}]</b><span>${esc(a.dataset.src || "출처 정보 없음")}</span>`;
  document.body.append(d);
  const r = a.getBoundingClientRect(), w = d.offsetWidth, h = d.offsetHeight;
  d.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + "px";
  d.style.top = (r.top - h - 8 > 8 ? r.top - h - 8 : r.bottom + 8) + "px";
}
window.addEventListener("scroll", closeFnPop, true);

/* ───────── 전역 단축키 · 확대 ───────── */
$("lb").onclick = () => { $("lb").hidden = true; };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("lb").hidden){ $("lb").hidden = true; return; }
  if (view === "wiki" && e.key === "Escape"){ wikiBack(); return; }
  if (view === "solve" && panelWiki && e.key === "Escape"){ closeWikiPanel(); return; }
  if (view !== "solve" || e.altKey || e.metaKey || e.ctrlKey) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if (e.key === "ArrowRight") go(session.i + 1);
  if (e.key === "ArrowLeft") go(session.i - 1);
});


/* ───────── 필기: 4지선다 ───────── */
const CIRC = "①②③④⑤";
function choicesHTML(q, r){
  const pick = r?.a?.length ? +r.a[0] : 0, peek = r?.how === "peek";
  const show = peek || (pick && (!hideRes() || session.open?.has(QI.get(session.ids[session.i])?.q === q ? session.ids[session.i] : "")));
  return `<div class="choices" role="group" aria-label="보기">${q.choices.map((c, i) => {
    const n = i + 1, cls = [n === pick ? "pick" : "", show && n === q.ans ? "ok" : "", show && n === pick && n !== q.ans ? "bad" : ""].join(" ");
    return `<button type="button" class="ch ${cls}" data-ch="${n}"><span class="cn">${CIRC[i]}</span><span class="ct">${escT(c)}</span></button>`; }).join("")}</div>`;
}
function bindChoices(id){
  const {q} = QI.get(id); if (!q.choices) return;
  const draw = r => { $("f").innerHTML = choicesHTML(q, r); bindChoices(id); };
  $("f").querySelectorAll("[data-ch]").forEach(b => b.onclick = () => {
    const cur = sres(id), n = +b.dataset.ch;
    if (cur?.v && cur.v !== "확인" && !hideRes()) return;                 // 채점된 문제는 그대로(모의고사 중엔 바꿀 수 있음)
    if (cur?.a?.[0] === String(n)) return;
    const v = n === q.ans ? "정답" : "오답";
    let r;
    if (cur?.v && cur.v !== "확인"){ r = record(id, {v, how:"self-edit", a:[String(n)], parts:[]}); r.how = "local"; Store.put(id, r); }
    else r = record(id, {v, how:"local", a:[String(n)], parts:[]});
    draw(r); showResult(id, r);
  });
}
document.addEventListener("keydown", e => {
  if (view !== "solve" || !session || e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) return;
  const b = /^[1-4]$/.test(e.key) && document.querySelector(`#f [data-ch="${e.key}"]`); if (b){ e.preventDefault(); b.click(); }
});

/* ───────── 시작 ───────── */
(async () => {
  try { await loadData(); }
  catch(e) { $("app").innerHTML = `<p class="empty">문제 파일을 불러오지 못했습니다. 페이지를 새로고침하세요.</p>`; return; }
  $("app").innerHTML = `<p class="empty">풀이 기록을 불러오는 중…</p>`;
  const sampleP = Promise.resolve(window.claude?.use?.("sample")).catch(() => null);
  await migrateOnce();
  await Store.init();
  if (!tryResume()) render();
  try { sample = await sampleP; } catch(e) { sample = null; }
  if (sample){ try { const lim = await sample.limits(); imgLim = lim?.images || null; imageOK = !!imgLim; toolsOK = !!lim?.tools; } catch(e) { imageOK = false; toolsOK = false; } }
  if (!sample) sampleOff = "unavailable";
  if (view === "solve" && session) renderAsk(session.ids[session.i]);
})();
</script>


</body></html>
