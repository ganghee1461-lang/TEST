<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가스기능사 오답노트</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="오답노트" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4f46e5; --primary-light: #eef2ff;
      --danger: #ef4444; --danger-light: #fef2f2;
      --success: #10b981; --success-light: #ecfdf5;
      --warn: #f59e0b; --warn-light: #fffbeb;
      --border: #e5e7eb; --text: #111827; --muted: #6b7280;
      --bg: #f9fafb; --card: #ffffff; --radius: 12px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header { background: var(--primary); color: #fff; padding: 12px 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(79,70,229,0.3); display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    #sync-status { font-size: 0.78rem; opacity: 0.85; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #86efac; flex-shrink: 0; }
    .dot.syncing { background: #fde68a; animation: pulse 1s infinite; }
    .dot.error { background: #fca5a5; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; margin-bottom: 16px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-sm { padding: 6px 14px; font-size: 0.82rem; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-count { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; flex-shrink: 0; background: #f3f4f6; color: var(--muted); transition: background 0.15s; }
    .btn-count:hover { background: var(--border); }

    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .filter-bar select, .filter-bar input { flex: 1; min-width: 100px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; outline: none; }
    .filter-bar select:focus, .filter-bar input:focus { border-color: var(--primary); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
    .badge-red { background: var(--danger-light); color: var(--danger); }
    .badge-orange { background: #fff7ed; color: #ea580c; }
    .badge-purple { background: var(--primary-light); color: var(--primary); }

    .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
    .tab { padding: 10px 18px; font-size: 0.88rem; font-weight: 500; cursor: pointer; border: none; background: none; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color 0.15s; white-space: nowrap; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .skeleton { background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; height: 64px; margin-bottom: 12px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* 오답목록 */
    .wrong-list { display: flex; flex-direction: column; gap: 12px; }
    .wrong-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: box-shadow 0.15s; }
    .wrong-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .wrong-item.count-2 .q-number { background: #fff7ed; color: #ea580c; }
    .wrong-item.count-3 .q-number { background: var(--danger-light); color: var(--danger); }
    .wrong-item-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none; }
    .wrong-item-header:hover { background: var(--bg); }
    .q-number { width: 36px; height: 36px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
    .q-info { flex: 1; min-width: 0; }
    .q-title { font-weight: 600; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .chevron { color: var(--muted); transition: transform 0.2s; font-size: 1rem; flex-shrink: 0; }
    .wrong-item.open .chevron { transform: rotate(180deg); }
    .wrong-item-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
    .wrong-item.open .wrong-item-body { display: block; }

    .study-question { font-size: 0.95rem; line-height: 1.65; font-weight: 500; margin: 14px 0 12px; white-space: pre-wrap; }
    .study-choices { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .study-choice { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.5; border: 1.5px solid var(--border); background: #fff; }
    .study-choice.is-answer { border-color: var(--success); background: var(--success-light); font-weight: 600; color: #065f46; }
    .study-choice-num { flex-shrink: 0; font-weight: 700; min-width: 18px; }
    .explanation-box { background: var(--bg); border-radius: 8px; padding: 12px 14px; font-size: 0.88rem; line-height: 1.7; white-space: pre-wrap; border-left: 3px solid var(--primary); }
    .section-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }

    /* 문제풀기 퀴즈 */
    #quiz-area { max-width: 600px; margin: 0 auto; }
    .quiz-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .quiz-back-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.2rem; padding: 4px; }
    .quiz-progress { flex: 1; display: flex; align-items: center; gap: 10px; }
    .quiz-progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .quiz-progress-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width 0.3s; }
    .quiz-progress-text { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
    .quiz-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; }
    .quiz-left-panel { }
    .quiz-right-panel { }
    body.landscape-mode .quiz-card { display: flex; gap: 0; padding: 0; overflow: hidden; }
    body.landscape-mode .quiz-left-panel { flex: 1; padding: 24px; border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
    body.landscape-mode .quiz-right-panel { flex: 1; padding: 24px; overflow-y: auto; }
    body.landscape-mode .quiz-nav { margin-bottom: 12px; }
    .quiz-round-badge { font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
    .quiz-question-text { font-size: 1rem; line-height: 1.7; font-weight: 500; margin-bottom: 20px; white-space: pre-wrap; }
    .quiz-choices { display: flex; flex-direction: column; gap: 10px; }
    .quiz-choice-btn { text-align: left; padding: 12px 16px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; font-size: 0.92rem; cursor: pointer; transition: all 0.15s; width: 100%; font-family: inherit; line-height: 1.5; display: flex; gap: 10px; align-items: flex-start; }
    .quiz-choice-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
    .quiz-choice-btn.correct { border-color: var(--success) !important; background: var(--success-light) !important; color: #065f46; font-weight: 600; }
    .quiz-choice-btn.wrong { border-color: var(--danger) !important; background: var(--danger-light) !important; color: #991b1b; }
    .quiz-choice-btn:disabled { cursor: default; }
    .quiz-choice-num { flex-shrink: 0; font-weight: 700; }
    .quiz-result-box { margin-top: 16px; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.92rem; }
    .quiz-result-box.ok { background: var(--success-light); color: #065f46; }
    .quiz-result-box.fail { background: var(--danger-light); color: #991b1b; }
    .quiz-explanation { margin-top: 12px; background: var(--bg); border-radius: 8px; padding: 14px; font-size: 0.88rem; line-height: 1.7; white-space: pre-wrap; border-left: 3px solid var(--primary); }
    .quiz-nav { display: flex; justify-content: flex-end; margin-top: 16px; }

    .quiz-summary { text-align: center; padding: 32px 20px; }
    .quiz-summary-score { font-size: 3rem; font-weight: 700; color: var(--primary); margin: 16px 0 8px; }
    .quiz-summary-label { font-size: 1rem; color: var(--muted); margin-bottom: 24px; }
    .quiz-missed-list { text-align: left; margin-top: 20px; }
    .quiz-missed-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--danger-light); border-radius: 8px; margin-bottom: 6px; font-size: 0.88rem; }

    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    label { font-size: 0.8rem; font-weight: 500; color: var(--muted); }
    select { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; outline: none; width: 100%; font-family: inherit; }
    select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .preview-text { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }

    .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty p { font-size: 0.9rem; }
    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1f2937; color: #fff; padding: 10px 20px; border-radius: 99px; font-size: 0.88rem; font-weight: 500; transition: transform 0.3s; z-index: 9999; white-space: nowrap; }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* 편집 모달 */
    #edit-modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.5); align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; }
    #edit-modal.open { display: flex; }
    #edit-modal-inner { background: #fff; border-radius: 16px; width: 100%; max-width: 600px; margin: auto; padding: 24px; }
    #edit-modal-inner h3 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; color: var(--primary); }
    .edit-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .edit-field label { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
    .edit-field input, .edit-field textarea, .edit-field select { border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 0.9rem; font-family: inherit; outline: none; width: 100%; }
    .edit-field input:focus, .edit-field textarea:focus, .edit-field select:focus { border-color: var(--primary); }
    .edit-field textarea { min-height: 80px; resize: vertical; }
    .edit-choices { display: flex; flex-direction: column; gap: 6px; }
    .edit-choice-row { display: flex; align-items: center; gap: 8px; }
    .edit-choice-num { font-weight: 700; font-size: 0.9rem; width: 20px; flex-shrink: 0; }
    .edit-modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

    /* 가로모드 */
    body.landscape-mode header { padding: 8px 16px; }
    body.landscape-mode .container { max-width: 100%; padding: 0; display: flex; flex-direction: column; height: calc(100vh - 48px); overflow: hidden; }
    body.landscape-mode .tabs { flex-shrink: 0; margin-bottom: 0; border-bottom: 2px solid var(--border); }
    body.landscape-mode .landscape-body { display: flex; flex: 1; overflow: hidden; }
    #landscape-left { display: none; width: 320px; min-width: 260px; border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; flex-shrink: 0; }
    #landscape-right { display: none; flex: 1; overflow-y: auto; padding: 20px; }
    body.landscape-mode.tab-list #landscape-left, body.landscape-mode.tab-list #landscape-right { display: block; }
    body.landscape-mode.tab-list #tab-list { display: none !important; }
    body.landscape-mode.tab-play #tab-play { display: flex; flex: 1; overflow: hidden; }
    body.landscape-mode.tab-play #tab-list { display: none !important; }
    body.landscape-mode.tab-play #quiz-setup { width: 300px; min-width: 260px; border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; flex-shrink: 0; }
    body.landscape-mode.tab-play #quiz-setup .card { box-shadow: none; border: none; padding: 0; }
    body.landscape-mode.tab-play #quiz-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; }
    body.landscape-mode.tab-play #quiz-area .quiz-header { flex-shrink: 0; }
    body.landscape-mode.tab-play #quiz-area .quiz-card { display: flex; gap: 16px; flex: 1; }
    body.landscape-mode.tab-play #quiz-area .quiz-card > * { flex: 1; }
    body.landscape-mode.tab-play .quiz-question-text { font-size: 1rem; }
    body.landscape-mode.tab-play #quiz-result { flex: 1; overflow-y: auto; padding: 16px; border-left: 1px solid var(--border); }
    body.landscape-mode .wrong-item.selected { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(79,70,229,0.2); }
    #layout-toggle { position: fixed; bottom: 24px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 1.2rem; cursor: pointer; z-index: 200; box-shadow: 0 2px 12px rgba(79,70,229,0.4); display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
    #layout-toggle:active { transform: scale(0.9); }
  </style>
</head>
<body>

<header>
  <h1>📝 가스기능사 오답노트</h1>
  <div id="sync-status">
    <div class="dot syncing" id="sync-dot"></div>
    <span id="sync-text">로딩 중...</span>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('play')">문제 풀기</button>
    <button class="tab" onclick="switchTab('list')">오답 목록</button>
  </div>

  <div class="landscape-body">
    <!-- ── 오답 목록 ── -->
    <div id="tab-list" class="tab-content">
      <div class="filter-bar">
        <select id="filter-round" onchange="renderList()"><option value="">전체 회차</option></select>
        <select id="filter-count" onchange="renderList()">
          <option value="">전체 횟수</option>
          <option value="1">1회</option>
          <option value="2">2회</option>
          <option value="3">3회 이상</option>
        </select>
        <input type="text" id="filter-search" placeholder="검색..." oninput="renderList()" style="max-width:140px; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:0.88rem; outline:none;" />
      </div>
      <div id="wrong-list" class="wrong-list">
        <div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>

    <!-- ── 문제 풀기 ── -->
    <div id="tab-play" class="tab-content active">
      <div id="quiz-setup">
        <div class="card">
          <h2 style="font-size:1rem;font-weight:600;margin-bottom:16px;color:var(--primary)">🎯 문제 풀기</h2>
          <div class="form-row">
            <div class="form-group">
              <label>회차 선택</label>
              <select id="quiz-round" onchange="updateQuizPreview()"><option value="">전체 회차</option></select>
            </div>
            <div class="form-group">
              <label>범위</label>
              <select id="quiz-scope" onchange="updateQuizPreview()">
                <option value="all">전체 문제</option>
                <option value="wrong">오답만</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>출제 순서</label>
            <select id="quiz-order">
              <option value="seq">번호 순서대로</option>
              <option value="rand">랜덤</option>
            </select>
          </div>
          <div class="preview-text" id="quiz-preview"></div>
          <button class="btn btn-primary" onclick="startQuiz()">시작하기</button>
        </div>
      </div>

      <div id="quiz-area" style="display:none">
        <div class="quiz-header">
          <button class="quiz-back-btn" onclick="backToSetup()" title="설정으로">←</button>
          <div class="quiz-progress">
            <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-prog-fill"></div></div>
            <span class="quiz-progress-text" id="quiz-prog-text"></span>
          </div>
        </div>
        <div class="quiz-card" id="quiz-card"></div>
      </div>

      <div id="quiz-result" style="display:none"></div>
    </div>

    <!-- 가로모드 오답 패널 -->
    <div id="landscape-left"></div>
    <div id="landscape-right">
      <div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted)">목록에서 문제를 선택하세요</div>
    </div>
  </div>
</div>

<!-- 편집 모달 -->
<div id="edit-modal">
  <div id="edit-modal-inner">
    <h3>✏️ 문제 편집</h3>
    <div class="edit-field">
      <label>문제</label>
      <textarea id="em-question" style="min-height:100px"></textarea>
    </div>
    <div class="edit-field">
      <label>선지</label>
      <div class="edit-choices">
        <div class="edit-choice-row"><span class="edit-choice-num">①</span><input type="text" id="em-c1" /></div>
        <div class="edit-choice-row"><span class="edit-choice-num">②</span><input type="text" id="em-c2" /></div>
        <div class="edit-choice-row"><span class="edit-choice-num">③</span><input type="text" id="em-c3" /></div>
        <div class="edit-choice-row"><span class="edit-choice-num">④</span><input type="text" id="em-c4" /></div>
      </div>
    </div>
    <div class="edit-field">
      <label>정답</label>
      <select id="em-answer">
        <option value="1">① 1번</option>
        <option value="2">② 2번</option>
        <option value="3">③ 3번</option>
        <option value="4">④ 4번</option>
      </select>
    </div>
    <div class="edit-field">
      <label>해설</label>
      <textarea id="em-explanation" style="min-height:120px"></textarea>
    </div>
    <div class="edit-modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeEditModal()">취소</button>
      <button class="btn btn-primary btn-sm" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<button id="layout-toggle" onclick="toggleLandscape()" title="가로/세로 전환">⇄</button>

<script>
const NUMS = ['①','②','③','④'];
let questions = [];  // all questions
let progress = {};   // {id: count} — local mirror
let sha_p = null;

function setSyncStatus(state, text) {
  document.getElementById('sync-text').textContent = text;
  const dot = document.getElementById('sync-dot');
  dot.className = 'dot' + (state==='syncing'?' syncing':state==='error'?' error':'');
}

function esc(s='') {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}

/* ── Data load ── */
async function fetchData() {
  setSyncStatus('syncing', '불러오는 중...');
  try {
    const r = await fetch('/api');
    if (!r.ok) throw new Error();
    const j = await r.json();
    const data = j.data || [];
    sha_p = j.sha_p || null;
    // split into questions + progress
    questions = data.map(d => {
      const { count, ...q } = d;
      return q;
    });
    progress = {};
    data.forEach(d => { if (d.count > 0) progress[d.id] = d.count; });
    setSyncStatus('ok', '동기화됨');
  } catch {
    setSyncStatus('error', '불러오기 실패');
    toast('데이터를 불러오지 못했습니다.');
  }
}

/* ── Progress update (단건) ── */
async function incrementProgress(id) {
  progress[id] = (progress[id] || 0) + 1;
  try {
    const r = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    if (!r.ok) throw new Error();
    const j = await r.json();
    if (j.sha_p) sha_p = j.sha_p;
  } catch {
    toast('진행 저장 실패');
  }
}

function getCount(id) { return progress[id] || 0; }

async function addToWrong(id, btn) {
  await incrementProgress(id);
  btn.textContent = '✓ 추가됨';
  btn.disabled = true;
  toast('오답노트에 추가됐습니다.');
}

/* ── Rounds ── */
function getRounds() {
  return [...new Set(questions.map(q => q.round))].sort();
}

function populateRoundSelects() {
  const rounds = getRounds();
  ['filter-round', 'quiz-round'].forEach(selId => {
    const sel = document.getElementById(selId);
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = '<option value="">전체 회차</option>';
    rounds.forEach(r => {
      const o = document.createElement('option');
      o.value = r; o.textContent = r;
      if (r === cur) o.selected = true;
      sel.appendChild(o);
    });
  });
}

/* ── Tabs ── */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['play','list'][i]===name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.body.classList.toggle('tab-list', name==='list');
  document.body.classList.toggle('tab-play', name==='play');
  if (name === 'list') {
    populateRoundSelects();
    if (landscapeMode) renderLandscapeList();
    else renderList();
  }
  if (name === 'play') { populateRoundSelects(); updateQuizPreview(); }
}

/* ── 오답 목록 ── */
function getWrongList(roundF='', countF='', search='') {
  return questions
    .filter(q => {
      const c = getCount(q.id);
      if (c === 0) return false;
      if (roundF && q.round !== roundF) return false;
      if (countF === '1' && c !== 1) return false;
      if (countF === '2' && c !== 2) return false;
      if (countF === '3' && c < 3) return false;
      if (search) {
        const hay = [q.qnum, q.round, q.question, q.explanation, ...(q.choices||[])].join(' ').toLowerCase();
        if (!hay.includes(search.toLowerCase())) return false;
      }
      return true;
    })
    .sort((a,b) => {
      if (a.round < b.round) return -1;
      if (a.round > b.round) return 1;
      return parseInt(a.qnum) - parseInt(b.qnum);
    });
}

function renderList() {
  const roundF = document.getElementById('filter-round').value;
  const countF = document.getElementById('filter-count').value;
  const search = document.getElementById('filter-search').value;
  const list = getWrongList(roundF, countF, search);
  const el = document.getElementById('wrong-list');

  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">✅</div><p>표시할 오답이 없습니다.</p></div>`;
    return;
  }

  el.innerHTML = list.map(q => {
    const c = getCount(q.id);
    const title = q.question ? (q.question.length>42 ? q.question.slice(0,42)+'…' : q.question) : `${q.qnum}번 문제`;
    const cc = c>=3?'count-3':c===2?'count-2':'count-1';
    const bc = c>=3?'badge-red':c===2?'badge-orange':'badge-purple';
    const hasChoices = q.choices && q.choices.some(c=>c);
    const choicesHtml = hasChoices ? `
      <div class="study-choices">
        ${q.choices.map((ch,i)=>ch?`<div class="study-choice${q.answer===i+1?' is-answer':''}"><span class="study-choice-num">${NUMS[i]}</span><span>${esc(ch)}</span></div>`:'').join('')}
      </div>` : '';

    return `
    <div class="wrong-item ${cc}" id="item-${q.id}">
      <div class="wrong-item-header" onclick="toggleItem('${q.id}')">
        <div class="q-number">${esc(q.qnum)}</div>
        <div class="q-info">
          <div class="q-title">${esc(title)}</div>
          <div class="q-meta">${esc(q.round)} · ${esc(q.qnum)}번</div>
        </div>
        <span class="badge ${bc}">✗ ${c}회</span>
        <button class="btn-count" onclick="manualIncrement(event,'${q.id}')" title="+1">+</button>
        <span class="chevron">▼</span>
      </div>
      <div class="wrong-item-body">
        ${q.question ? `<div class="study-question">${esc(q.question)}</div>` : ''}
        ${choicesHtml}
        ${q.explanation ? `<div class="section-label">해설</div><div class="explanation-box">${esc(q.explanation)}</div>` : ''}
        ${!q.question && !q.explanation ? '<div style="color:var(--muted);font-size:0.85rem;margin-top:12px">내용이 없습니다.</div>' : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleItem(id) { document.getElementById('item-'+id)?.classList.toggle('open'); }

async function manualIncrement(e, id) {
  e.stopPropagation();
  await incrementProgress(id);
  renderList();
  toast(`${questions.find(q=>q.id===id)?.qnum}번 — ${getCount(id)}회`);
}

/* ── 문제 풀기 ── */
let quizQueue = [];
let quizIndex = 0;
let quizScore = 0;
let quizMissed = [];
let quizAnswered = false;

function getQuizList(roundF, scope) {
  return questions
    .filter(q => {
      if (roundF && q.round !== roundF) return false;
      if (scope === 'wrong' && getCount(q.id) === 0) return false;
      return q.choices && q.choices.some(c=>c) && q.answer;
    })
    .sort((a,b) => {
      if (a.round < b.round) return -1;
      if (a.round > b.round) return 1;
      return parseInt(a.qnum) - parseInt(b.qnum);
    });
}

function updateQuizPreview() {
  const roundF = document.getElementById('quiz-round').value;
  const scope  = document.getElementById('quiz-scope').value;
  const list   = getQuizList(roundF, scope);
  document.getElementById('quiz-preview').textContent = `풀 수 있는 문제: ${list.length}개`;
}

function startQuiz() {
  const roundF = document.getElementById('quiz-round').value;
  const scope  = document.getElementById('quiz-scope').value;
  const order  = document.getElementById('quiz-order').value;
  let list = getQuizList(roundF, scope);
  if (!list.length) { toast('풀 수 있는 문제가 없습니다.'); return; }
  if (order === 'rand') list = list.sort(() => Math.random() - 0.5);
  quizQueue = list;
  quizIndex = 0; quizScore = 0; quizMissed = []; quizAnswered = false;
  document.getElementById('quiz-setup').style.display = 'none';
  document.getElementById('quiz-result').style.display = 'none';
  document.getElementById('quiz-area').style.display = landscapeMode ? 'flex' : 'block';
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = quizQueue[quizIndex];
  const total = quizQueue.length;
  document.getElementById('quiz-prog-fill').style.width = (quizIndex/total*100)+'%';
  document.getElementById('quiz-prog-text').textContent = `${quizIndex+1} / ${total}`;
  quizAnswered = false;

  const choicesHtml = q.choices.map((c,i) => c ? `
    <button class="quiz-choice-btn" onclick="submitAnswer(${i+1})" data-num="${i+1}">
      <span class="quiz-choice-num">${NUMS[i]}</span><span>${esc(c)}</span>
    </button>` : '').join('');

  document.getElementById('quiz-card').innerHTML = `
    <div class="quiz-left-panel">
      <div class="quiz-round-badge">${esc(q.round)} · ${esc(q.qnum)}번</div>
      <div class="quiz-question-text">${esc(q.question || q.qnum+'번 문제')}</div>
    </div>
    <div class="quiz-right-panel">
      <div class="quiz-nav" id="qnav" style="display:none">
        <button class="btn btn-primary" onclick="nextQuestion()">
          ${quizIndex+1<total ? '다음 문제 →' : '결과 보기'}
        </button>
      </div>
      <div class="quiz-choices" id="qchoices">${choicesHtml}</div>
      <div id="qresult"></div>
    </div>`;
}

async function submitAnswer(chosen) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = quizQueue[quizIndex];
  const isCorrect = chosen === q.answer;

  document.querySelectorAll('.quiz-choice-btn').forEach(btn => {
    btn.disabled = true;
    const num = parseInt(btn.dataset.num);
    if (num === q.answer) btn.classList.add('correct');
    else if (num === chosen) btn.classList.add('wrong');
  });

  if (isCorrect) {
    quizScore++;
    document.getElementById('qresult').innerHTML = `
      <div class="quiz-result-box ok">✓ 정답입니다!</div>
      ${q.explanation ? `<div class="quiz-explanation">${esc(q.explanation)}</div>` : ''}
      <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="addToWrong('${q.id}', this)">+ 오답노트 추가</button>`;
  } else {
    quizMissed.push(q);
    await incrementProgress(q.id);
    document.getElementById('qresult').innerHTML = `
      <div class="quiz-result-box fail">✗ 오답입니다. 정답: ${NUMS[q.answer-1]}</div>
      ${q.explanation ? `<div class="quiz-explanation">${esc(q.explanation)}</div>` : ''}`;
  }
  document.getElementById('qnav').style.display = 'flex';
}

function nextQuestion() {
  quizIndex++;
  if (quizIndex >= quizQueue.length) showQuizResult();
  else renderQuizQuestion();
}

function showQuizResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const total = quizQueue.length;
  const pct = Math.round(quizScore/total*100);
  const missedHtml = quizMissed.map(q => `
    <div class="quiz-missed-item">
      <span class="badge badge-red">✗</span>
      <span>${esc(q.round)} ${esc(q.qnum)}번</span>
      <span style="color:var(--muted);font-size:0.82rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.question?q.question.slice(0,30)+'…':'')}</span>
    </div>`).join('');

  document.getElementById('quiz-result').style.display = 'block';
  document.getElementById('quiz-result').innerHTML = `
    <div class="card quiz-summary">
      <div style="font-size:1.1rem;font-weight:600">퀴즈 완료!</div>
      <div class="quiz-summary-score">${pct}%</div>
      <div class="quiz-summary-label">${total}문제 중 ${quizScore}개 정답</div>
      ${quizMissed.length
        ? `<div class="quiz-missed-list"><div class="section-label" style="margin-bottom:8px">틀린 문제 (${quizMissed.length}개)</div>${missedHtml}</div>`
        : '<div style="color:var(--success);font-weight:600;margin-top:12px">🎉 모두 정답!</div>'}
      <div style="display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="retryMissed()" ${!quizMissed.length?'disabled':''}>틀린 것만 다시</button>
        <button class="btn btn-ghost" onclick="backToSetup()">처음으로</button>
      </div>
    </div>`;
}

function retryMissed() {
  quizQueue = [...quizMissed];
  quizIndex = 0; quizScore = 0; quizMissed = []; quizAnswered = false;
  document.getElementById('quiz-result').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  renderQuizQuestion();
}

function backToSetup() {
  document.getElementById('quiz-result').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('quiz-setup').style.display = 'block';
  updateQuizPreview();
}

/* ── 가로모드 ── */
let landscapeMode = false;
let selectedId = null;

function toggleLandscape() {
  landscapeMode = !landscapeMode;
  document.body.classList.toggle('landscape-mode', landscapeMode);
  document.getElementById('layout-toggle').textContent = landscapeMode ? '☰' : '⇄';
  const curTab = document.querySelector('.tab-content.active')?.id === 'tab-list' ? 'list' : 'play';
  document.body.classList.toggle('tab-list', curTab==='list');
  document.body.classList.toggle('tab-play', curTab==='play');
  if (landscapeMode && curTab==='list') { renderLandscapeList(); renderDetail(selectedId); }
}

function buildLandscapeItem(q) {
  const c = getCount(q.id);
  const title = q.question ? (q.question.length>34?q.question.slice(0,34)+'…':q.question) : `${q.qnum}번 문제`;
  const cc = c>=3?'count-3':c===2?'count-2':c>0?'count-1':'';
  const bc = c>=3?'badge-red':c===2?'badge-orange':'badge-purple';
  const sel = q.id===selectedId?'selected':'';
  return `
  <div class="wrong-item ${cc} ${sel}" id="litem-${q.id}" onclick="selectItem('${q.id}')">
    <div class="wrong-item-header" style="cursor:pointer">
      <div class="q-number">${esc(q.qnum)}</div>
      <div class="q-info"><div class="q-title">${esc(title)}</div><div class="q-meta">${esc(q.round)}</div></div>
      ${c>0?`<span class="badge ${bc}">✗ ${c}회</span>`:''}
    </div>
  </div>`;
}

function renderLandscapeList() {
  const roundF = document.getElementById('lf-round')?.value || '';
  const search = document.getElementById('lf-search')?.value || '';
  const rounds = getRounds();
  let list = questions.filter(q => {
    if (roundF && q.round !== roundF) return false;
    if (search) {
      const hay = [q.qnum, q.round, q.question, ...(q.choices||[])].join(' ').toLowerCase();
      if (!hay.includes(search.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b) => {
    if (a.round<b.round) return -1; if (a.round>b.round) return 1;
    return parseInt(a.qnum)-parseInt(b.qnum);
  });

  const left = document.getElementById('landscape-left');
  left.innerHTML = `
    <div class="filter-bar" style="margin-bottom:10px">
      <select id="lf-round" onchange="renderLandscapeList()" style="flex:1;min-width:0;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:0.88rem;outline:none">
        <option value="">전체 회차</option>
        ${rounds.map(r=>`<option value="${esc(r)}" ${roundF===r?'selected':''}>${esc(r)}</option>`).join('')}
      </select>
      <input type="text" id="lf-search" placeholder="검색..." oninput="renderLandscapeList()" value="${esc(search)}" style="flex:1;min-width:0;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:0.88rem;outline:none" />
    </div>
    <div class="wrong-list">
      ${list.length ? list.map(buildLandscapeItem).join('') : '<div class="empty"><p>없습니다.</p></div>'}
    </div>`;
}

function selectItem(id) {
  selectedId = id;
  document.querySelectorAll('#landscape-left .wrong-item').forEach(el => el.classList.remove('selected'));
  document.getElementById('litem-'+id)?.classList.add('selected');
  renderDetail(id);
}

function renderDetail(id) {
  const right = document.getElementById('landscape-right');
  if (!id) { right.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted)">목록에서 문제를 선택하세요</div>`; return; }
  const q = questions.find(x=>x.id===id);
  if (!q) return;
  const c = getCount(id);
  const bc = c>=3?'badge-red':c===2?'badge-orange':'badge-purple';
  const hasChoices = q.choices && q.choices.some(ch=>ch);
  const choicesHtml = hasChoices ? `
    <div class="study-choices">
      ${q.choices.map((ch,i)=>ch?`<div class="study-choice${q.answer===i+1?' is-answer':''}"><span class="study-choice-num">${NUMS[i]}</span><span>${esc(ch)}</span></div>`:'').join('')}
    </div>` : '';
  right.innerHTML = `
    <div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)">
        <div class="q-number" style="width:44px;height:44px;font-size:1rem">${esc(q.qnum)}</div>
        <div style="flex:1">
          <div style="font-size:1rem;font-weight:600">${esc(q.round)} · ${esc(q.qnum)}번</div>
          ${c>0?`<div style="margin-top:3px"><span class="badge ${bc}">✗ ${c}회</span></div>`:''}
        </div>
      </div>
      ${q.question ? `<div class="study-question">${esc(q.question)}</div>` : ''}
      ${choicesHtml}
      ${q.explanation ? `<div class="section-label" style="margin-top:12px">해설</div><div class="explanation-box">${esc(q.explanation)}</div>` : ''}
    </div>`;
}

/* ── 편집 모달 ── */
let editingId = null;

function openEditModal(id) {
  const q = questions.find(x => x.id === id);
  if (!q) return;
  editingId = id;
  document.getElementById('em-question').value = q.question || '';
  const choices = q.choices || ['','','',''];
  [1,2,3,4].forEach(i => { document.getElementById('em-c'+i).value = choices[i-1] || ''; });
  document.getElementById('em-answer').value = q.answer || 1;
  document.getElementById('em-explanation').value = q.explanation || '';
  document.getElementById('edit-modal').classList.add('open');
}

function closeEditModal() {
  document.getElementById('edit-modal').classList.remove('open');
  editingId = null;
}

async function saveEdit() {
  if (!editingId) return;
  const q = questions.find(x => x.id === editingId);
  if (!q) return;

  q.question = document.getElementById('em-question').value.trim();
  q.choices = [1,2,3,4].map(i => document.getElementById('em-c'+i).value.trim());
  q.answer = parseInt(document.getElementById('em-answer').value);
  q.explanation = document.getElementById('em-explanation').value.trim();

  setSyncStatus('syncing', '저장 중...');
  try {
    const r = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'question', question: q }),
    });
    if (!r.ok) throw new Error();
    setSyncStatus('ok', '동기화됨');
    toast('수정됐습니다.');
    closeEditModal();
    renderList();
  } catch {
    setSyncStatus('error', '저장 실패');
    toast('저장에 실패했습니다.');
  }
}

document.getElementById('edit-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('edit-modal')) closeEditModal();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

fetchData().then(() => {
  populateRoundSelects();
  renderList();
});
</script>
</body>
</html>
