<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0a800">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>가스기능사 실기 연습장</title>
<style>
:root{--bg:#f3f4f2;--surface:#fff;--fg:#1d2321;--muted:#5d6763;--line:#d9ddda;--accent:#e0a800;--accent-ink:#3a2c00;--bad:#b3261e;--ok:#1f5fbf;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--surface:#1d2220;--fg:#e8ebe9;--muted:#9aa49f;--line:#323a37;--accent:#f2c230;--accent-ink:#2a2000;--bad:#f07d74;--ok:#6ea8ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.6 var(--font);padding:24px 16px}
main{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.3rem;margin:0}
p{margin:0}.muted{color:var(--muted);font-size:.85rem}
label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
input{font:inherit;color:var(--fg);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input:focus{outline:2px solid var(--accent);border-color:transparent}
button{font:inherit;font-weight:600;padding:11px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;border-color:var(--line);color:var(--fg);font-weight:500}
button:disabled{opacity:.55;cursor:default}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>가스기능사 실기 연습장</h1>

  <section id="s-load"><p class="muted">불러오는 중…</p></section>

  <form id="s-pass" hidden>
    <p class="muted">문제 데이터는 암호화되어 있습니다. 이 기기에서 처음 한 번만 비밀번호를 넣으면 됩니다.</p>
    <label>데이터 비밀번호<input id="pass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="pass-err"></p>
    <button id="pass-go">열기</button>
  </form>

  <form id="s-key" hidden>
    <p class="muted">Claude 질문·서술형 채점·손글씨 읽기에 쓸 Anthropic API 키를 넣어 주세요. 키는 이 기기 브라우저에만 저장되고 Anthropic으로만 보내집니다.</p>
    <label>Anthropic API 키<input id="key" type="password" autocomplete="off" placeholder="sk-ant-..."></label>
    <p class="err" id="key-err"></p>
    <button id="key-go">저장하고 시작</button>
    <button type="button" class="ghost" id="key-skip">나중에 (Claude 기능 없이 시작)</button>
  </form>

  <section id="s-prep" hidden>
    <p class="muted" id="prep-txt">문제와 사진을 이 기기에 받는 중…</p>
    <div class="bar"><i id="prep-bar"></i></div>
  </section>

  <section id="s-nosw" hidden>
    <p class="err">이 브라우저에서는 앱을 열 수 없습니다(서비스 워커 미지원). 사파리·크롬 최신 버전으로 열어 주세요. 개인정보 보호 모드에서는 안 될 수 있습니다.</p>
  </section>
</main>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const show = id => { for (const s of ["s-load", "s-pass", "s-key", "s-prep", "s-nosw"]) $(s).hidden = s !== id; };
  const CFG_KEY = "gp-web-config";
  const cfg = () => { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch(e){ return {}; } };
  const setCfg = v => { try { localStorage.setItem(CFG_KEY, JSON.stringify({...cfg(), ...v})); } catch(e) {} };

  if (!("serviceWorker" in navigator) || !window.crypto?.subtle){ show("s-nosw"); return; }
  const reg = await navigator.serviceWorker.register("sw.js");
  await navigator.serviceWorker.ready;

  const idb = () => new Promise((ok, no) => { const r = indexedDB.open("gp-web", 1); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("docs")) d.createObjectStore("docs"); if (!d.objectStoreNames.contains("keys")) d.createObjectStore("keys"); }; r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  const keyGet = async () => { const d = await idb(); return new Promise(ok => { const t = d.transaction("keys").objectStore("keys").get("data"); t.onsuccess = () => ok(t.result || null); t.onerror = () => ok(null); }); };
  const keyPut = async k => { const d = await idb(); return new Promise((ok, no) => { const t = d.transaction("keys", "readwrite"); t.objectStore("keys").put(k, "data"); t.oncomplete = ok; t.onerror = () => no(t.error); }); };

  let meta;
  try { meta = await (await fetch("enc/meta.json", {cache: "no-cache"})).json(); }
  catch(e){ $("s-load").innerHTML = '<p class="err">데이터 정보를 받지 못했습니다. 인터넷 연결을 확인하고 새로 고침하세요.</p>'; return; }
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function derive(pass){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(meta.salt), iterations: meta.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  }
  async function checkKey(k){
    try { const c = b64(meta.check); const p = await crypto.subtle.decrypt({name: "AES-GCM", iv: c.slice(0, 12)}, k, c.slice(12)); return new TextDecoder().decode(p) === "gas-practice"; }
    catch(e){ return false; }
  }

  /* 사진까지 미리 받아 두기(오프라인용). 실패해도 앱은 열림 */
  async function prefetch(){
    show("s-prep");
    const list = meta.files || [];
    let done = 0;
    const one = async f => { try { await fetch(f); } catch(e) {} done++; $("prep-bar").style.width = (done / list.length * 100).toFixed(1) + "%"; $("prep-txt").textContent = `문제와 사진을 이 기기에 받는 중… ${done}/${list.length}`; };
    const q = [...list]; await Promise.all(Array.from({length: 6}, async () => { while (q.length) await one(q.shift()); }));
    try { localStorage.setItem("gp-web-prefetched", meta.version); } catch(e) {}
  }
  async function go(){
    if (localStorage.getItem("gp-web-prefetched") !== meta.version) await prefetch();
    location.replace("app.html");
  }

  let k = await keyGet();
  if (k && !(await checkKey(k))) k = null;   // 비밀번호가 바뀌었으면 다시 묻기
  async function afterKey(){
    if (!cfg().apiKey && !localStorage.getItem("gp-web-key-skipped")){ show("s-key"); $("key").focus(); return; }
    await go();
  }
  if (k){ await afterKey(); }
  else { show("s-pass"); $("pass").focus(); }

  $("s-pass").onsubmit = async e => {
    e.preventDefault(); $("pass-err").textContent = ""; $("pass-go").disabled = true;
    try {
      const kk = await derive($("pass").value);
      if (!(await checkKey(kk))){ $("pass-err").textContent = "비밀번호가 맞지 않습니다."; return; }
      await keyPut(kk); await afterKey();
    } finally { $("pass-go").disabled = false; }
  };
  $("s-key").onsubmit = async e => {
    e.preventDefault(); const v = $("key").value.trim();
    if (!/^sk-ant-/.test(v)){ $("key-err").textContent = "sk-ant- 로 시작하는 키를 넣어 주세요."; return; }
    $("key-go").disabled = true; $("key-err").textContent = "확인 중…";
    try {
      const r = await fetch("https://api.anthropic.com/v1/messages", {method: "POST", headers: {"content-type": "application/json", "x-api-key": v, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"}, body: JSON.stringify({model: "claude-haiku-5-5", max_tokens: 5, messages: [{role: "user", content: "ok"}]})});
      if (r.status === 401 || r.status === 403){ $("key-err").textContent = "키가 맞지 않습니다."; return; }
    } catch(e) { /* 오프라인이면 일단 저장 */ }
    finally { $("key-go").disabled = false; }
    setCfg({apiKey: v}); $("key-err").textContent = ""; await go();
  };
  $("key-skip").onclick = async () => { try { localStorage.setItem("gp-web-key-skipped", "1"); } catch(e) {} await go(); };
})();
</script>
</body>
</html>
